# Trivy filesystem scan — findings suppressed with a reason, never blanket.
#
# Sentrook's job is detecting secrets, so its own fixtures necessarily contain
# secret-shaped strings. Every entry below is a parity or golden fixture whose
# whole purpose is to assert that these strings get redacted; a scanner finding
# them is the fixture working, not a leak.
#
# Scoped to individual files. Do not add source directories here — if a real
# credential is ever pasted into code, this must still catch it.
secrets:
  - id: stripe-access-token
    paths:
      - "fixtures/secret_redaction_golden.jsonl"
  - id: aws-secret-access-key
    paths:
      - "fixtures/secret_redaction_golden.jsonl"
  - id: gcp-api-key
    paths:
      - "fixtures/secret_redaction_golden.jsonl"
  - id: slack-access-token
    paths:
      - "fixtures/secret_redaction_golden.jsonl"
  - id: github-pat
    paths:
      - "fixtures/secret_redaction_golden.jsonl"
      - "fixtures/exec_shape_golden.jsonl"
