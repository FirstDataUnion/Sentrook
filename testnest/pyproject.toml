[project]
name = "testnest"
dynamic = ["version"]
description = "Scenario test harness for Sentrook (FIDU prototype)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "FirstDataUnion" },
]
dependencies = [
    "sentrook",
    "pyyaml>=6.0.2",
    "typer>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/FirstDataUnion/Sentrook"
Repository = "https://github.com/FirstDataUnion/Sentrook"
Issues = "https://github.com/FirstDataUnion/Sentrook/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
testnest = "testnest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "testnest/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["testnest"]

[tool.hatch.build.targets.wheel.force-include]
"fixtures" = "fixtures"

[tool.hatch.build.targets.sdist]
packages = ["testnest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../sentrook"]

[tool.uv.sources]
sentrook = { path = "..", editable = true }
