name: sentrook
version: 2.0.0-beta.18
# Hermes installers cap install at manifest_version 1; no v2-only fields are used.
manifest_version: 1
api_version: 1
# Oldest Hermes the plugin is tested on. Also declared in the catalog entry; older Hermes skips the plugin.
requires_hermes: ">=0.23.0"
description: >
  Scans agent tool calls with Sentrook and allows, escalates to Hermes's native approval, or blocks them.
author: First Data Union
license: MIT
homepage: https://github.com/FirstDataUnion/Sentrook
tags:
  - security
  - scan
provides_hooks:
  - pre_llm_call
  - post_api_request
  - pre_tool_call
  - post_tool_call
  - post_approval_response
# The scan credentials. `hermes plugins install` asks for them; Hermes stores them, never config.yaml,
# and the plugin reads them only through Hermes (agent.secret_scope.get_secret).
# No requires_env: the install would prompt for a client id and secret the user does not have yet.
# `hermes sentrook login` stores them (after-install.md says so); both stay declared as secrets below.
config_schema:
  client_id:
    type: secret
    env: SENTROOK_SCAN_CLIENT_ID
    description: Scan client ID from the identity service. Kept by Hermes, never in config.yaml.
  client_secret:
    type: secret
    env: SENTROOK_SCAN_CLIENT_SECRET
    description: Scan client secret from the identity service. Kept by Hermes, never in config.yaml.
  scan_url:
    type: str
    description: Sentrook scan service base URL. Non-default values must be https on a firstdataunion.org host unless SENTROOK_DEV_ENDPOINTS=1. Env SENTROOK_SCAN_URL.
  rookery_url:
    type: str
    description: Rookery base URL (same host rule). Env SENTROOK_ROOKERY_URL.
  oidc_issuer:
    type: str
    description: Identity service issuer URL (same host rule). Env SENTROOK_OIDC_ISSUER.
  mode:
    type: str
    default: enforce
    description: enforce | observe. observe scores and logs every call but never blocks or asks. Env SENTROOK_MODE.
  review_at:
    type: float
    default: 45
    description: Ask for approval at or above this risk. Env SENTROOK_REVIEW_AT.
  block_at:
    type: float
    default: 80
    description: Block at or above this risk. Env SENTROOK_BLOCK_AT.
  on_scan_error:
    type: str
    default: review
    description: >
      allow | deny | review when Sentrook returns no usable score. Auth and configuration errors never
      fail open; unattended runs block. Env SENTROOK_ON_SCAN_ERROR.
  attended_platforms:
    type: list
    description: >
      Extra session platforms with a human answering approvals (e.g. api_server behind a UI that shows
      Hermes approval prompts). Elsewhere outside chat platforms, a review holds the call for the owner's
      `/sentrook allow` or `/sentrook deny`. Env SENTROOK_ATTENDED_PLATFORMS.
  owner_channel:
    type: str
    description: >
      The platform (e.g. telegram) whose home channel gets the notice of a call held on an unattended run,
      and of a call blocked there because the scan failed (at most once per job, or per session for other
      runs, every 6 hours), and of a background skill or memory save blocked, held or let through without
      asking (at most one of each per session every 6 hours). Until it is set no notice is sent (status and
      verify say so); the call is still held, blocked or let through. Env
      SENTROOK_OWNER_CHANNEL.
  skill_review:
    type: str
    default: allow
    description: >
      allow | review. allow declares Hermes's own background skill and memory saves (the self-improvement
      review and the curator) to Sentrook and sends the recent conversation, redacted, so the save is judged
      against what was said. Either way these saves never ask for approval (nobody is there to answer):
      a review Sentrook marks lenient (only with allow) lets the save through, any other review holds it
      (not saved; with allow, a save Hermes can replay is staged in Hermes's pending list for the owner's
      /skills or /memory approve), and the owner is told on owner_channel. review sends them like any other
      call, without the conversation, and deletes the kept conversations. false (off, no) reads as review and
      true as allow; any other value reads as allow (status and the startup log name it). Env SENTROOK_SKILL_REVIEW.
  timeout_ms:
    type: int
    default: 30000
    description: Wait for /scan in ms (the token mint has its own budget). Env SENTROOK_SCAN_TIMEOUT_MS.
  channel_bindings:
    type: list
    description: >
      Channels this deployment normally delivers to; sent as destination grants. `/sentrook bind`
      adds more without editing this (kept in the state dir's grants.json).
  grants:
    type: list
    description: >
      Owner grants: [{kind: destination|file|provider, pattern, allows?}], applied in every session.
      A grant here has no session, so one with scope session (or any scope other than persistent) is
      never sent; status and verify flag it.
      `/sentrook grant` adds more without editing this (kept in the state dir's grants.json).
