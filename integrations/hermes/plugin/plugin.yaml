name: sentrook
version: 0.1.0-beta.0
manifest_version: 2
api_version: 1
description: >
  Sentrook trajectory scanner (hosted HTTPS). Scans tool calls and can allow,
  escalate to Hermes native approval, or block flagged actions.
author: First Data Union
license: Apache-2.0
homepage: https://github.com/FirstDataUnion/Sentrook
tags:
  - security
  - gateway
  - scan
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - post_approval_response
  - on_session_finalize
  - on_session_reset
  - subagent_start
# Credentials are optional at load time so `verify` can report "not covering"
# honestly when unset. Prefer ~/.hermes/.env (see README / configure).
config_schema:
  timeout_ms:
    type: int
    default: 60000
    description: >
      Scan request timeout in ms. Gates the agent while awaiting /scan.
      Default 60000 to absorb cold-start / quiet-host warmup. Env override:
      SENTROOK_SCAN_TIMEOUT_MS.
  on_scan_error:
    type: str
    default: review
    description: >
      When /scan times out, cannot connect, returns 5xx, or is rate-limited.
      allow | deny | review. Default review (escalate). Unattended cron/subagent
      still blocks. Env: SENTROOK_ON_SCAN_ERROR.
  feedback_mode:
    type: str
    default: submit
    description: >
      off | submit. submit POSTs sanitized review resolutions to hosted
      /feedback. Env: SENTROOK_FEEDBACK_MODE.
  scan_base_url:
    type: str
    default: https://sentrook.firstdataunion.org
    description: >
      Hosted Sentrook base URL (no trailing slash). Env: SENTROOK_SCAN_BASE_URL.
