[project]
name = "sentrook"
dynamic = ["version"]
description = "Agent execution trajectory scanner (FIDU Sentrook)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
authors = [
    { name = "FirstDataUnion" },
]
dependencies = [
    "pydantic>=2.10.0",
    "pyjwt[crypto]>=2.13.0",
    # SCA (Trivy) requires cryptography>=50; see [tool.uv] override below.
    "cryptography>=50.0.0",
    "pyyaml>=6.0.2",
    "typer>=0.15.0",
    "fastembed>=0.8.0",
    # OpenBao / Vault KV client (prod secrets via agent token sink).
    # Latest secure: 2.4.0 (Safety; fixes Authlib/Werkzeug issues in <2.3.0).
    "hvac>=2.4.0",
]

[project.urls]
Homepage = "https://github.com/FirstDataUnion/Sentrook"
Repository = "https://github.com/FirstDataUnion/Sentrook"
Issues = "https://github.com/FirstDataUnion/Sentrook/issues"
"Bug Tracker" = "https://github.com/FirstDataUnion/Sentrook/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff==0.16.2",
]
# Presidio + spaCy NER for Rookery corpus ingest spike (not on scan hot path).
# Also: python -m spacy download en_core_web_sm
ner = [
    "presidio-analyzer==2.2.364",
    "presidio-anonymizer==2.2.364",
    "spacy==3.8.14",
]

[project.scripts]
sentrook = "sentrook.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "sentrook/sentrook/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["sentrook/sentrook"]
# Ensure non-Python sanitize rules ship in the wheel

[tool.hatch.build.targets.sdist]
packages = ["sentrook/sentrook"]

[tool.hatch.build.force-include]
"sentrook/sentrook/sanitize/rules.yaml" = "sentrook/sentrook/sanitize/rules.yaml"

[tool.pytest.ini_options]
testpaths = ["sentrook/tests"]
pythonpath = ["sentrook"]
markers = [
    "l3_embed: run with the real fastembed bi-encoder (network/model download)",
    "ner_presidio: Presidio+spaCy NER corpus scrub (needs sentrook[ner] + en_core_web_sm)",
]

# Ruff — lint + format (CI and `make lint`). Rule set is intentionally lenient
# (E501/UP042/B008 ignored); tighten gradually once CI is in place.
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["sentrook", "testnest"]
extend-exclude = [
    ".venv",
    "node_modules",
    "integrations/openclaw/plugin/node_modules",
    "integrations/openclaw/plugin/dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # line length — formatter owns wrapping; long strings/URLs are common
    "UP042",  # str, Enum → StrEnum; leave for a dedicated pass (serialization callers)
    "B008",  # function calls in defaults — Typer Option/Argument pattern
]

[tool.ruff.lint.per-file-ignores]
"sentrook/tests/**" = ["B011"]
"testnest/tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# presidio-anonymizer==2.2.364 declares cryptography>=48.0.1,<49.0.0. That upper
# bound blocks the Trivy-required 50.0.0 line; override until Presidio ships a
# release that allows it. NER is off the scan hot path — revisit on upgrade.
[tool.uv]
override-dependencies = [
    "cryptography>=50.0.0",
]
