# Push protection and secret-scanning alerts ignore only the files listed
# here. Keep this list tight: a real leak in an ignored path will not be
# blocked.
#
# fixtures/secret_redaction_golden.jsonl is the Python/TypeScript parity
# corpus for sanitize. Its inputs are vendor-shaped but inert (alphabet
# runs, sequential digits, AWS's documented EXAMPLE key). GitHub's partner
# patterns for Stripe, Slack, and Airtable are the same shapes we must
# actually redact, so those rows cannot be made "scanner-inert" without
# under-testing the rules.
#
# This file is read from the repository default branch. Landing it on a
# feature branch does not unblock that branch's first push.
paths-ignore:
  - "fixtures/secret_redaction_golden.jsonl"
