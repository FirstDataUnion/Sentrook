# Phase 3B — gated publish of @firstdataunion/sentrook-openclaw to public npmjs and, when asked, ClawHub.
# Manual only. Merging to main / Changesets Version PRs never publish.
#
# Operator: bump via Changesets → merge Version PR → dispatch this workflow
# with channel=next|latest → approve Environment release-npm.
#
# One artifact: the tarball is packed once; ClawHub and npm get the same bytes.
# Every run (dry_run too) validates it with the ClawHub CLI and does a ClawHub --dry-run publish.
# With clawhub=true it is published to ClawHub first and the job waits for ClawHub's security
# checks; a release that is blocked, fails or is still pending at the deadline stops the job
# before npm. Channel next goes to the ClawHub tag beta (`openclaw plugins install <name>@beta`),
# latest to latest.
#
# Auth: npm Trusted Publishing (OIDC). No NPM_TOKEN.
# Trusted Publisher on npmjs: org FirstDataUnion, repo Sentrook,
# workflow release-plugin.yml, environment release-npm.
# ClawHub: trusted publishing (OIDC, audience clawhub), no token. It can only be configured after one
# manual publish under the firstdataunion owner:
#   clawhub package trusted-publisher set @firstdataunion/sentrook-openclaw \
#     --repository FirstDataUnion/Sentrook --workflow-filename release-plugin.yml --environment release-npm
# Until then leave clawhub=false: without it the CLI finds no token and the job stops before npm.
name: release-plugin

on:
  workflow_dispatch:
    inputs:
      channel:
        description: npm dist-tag (next = prerelease soak; latest = stable)
        required: true
        type: choice
        options:
          - next
          - latest
      require_full_eval:
        description: Require rookery/full-eval success on this SHA
        required: false
        type: boolean
        default: true
      dry_run:
        description: Run tests + gates only; skip npm publish and GitHub Release
        required: false
        type: boolean
        default: false
      clawhub:
        description: Also publish to ClawHub (needs its trusted publisher, set after the first manual publish)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sentrook-release-plugin
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  NPMJS_REGISTRY: "https://registry.npmjs.org"
  PLUGIN_DIR: integrations/openclaw/plugin
  CLAWHUB_CLI: "clawhub@0.25.1"
  CLAWHUB_OWNER: firstdataunion

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release-npm
    permissions:
      contents: write
      id-token: write
      statuses: read # GET commits/{sha}/status for rookery/full-eval
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require rookery/full-eval on this SHA
        if: ${{ inputs.require_full_eval }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          state="$(gh api "repos/${{ github.repository }}/commits/${SHA}/status" \
            --jq '.statuses | map(select(.context=="rookery/full-eval")) | .[0].state // empty')"
          if [ -z "${state}" ]; then
            echo "No rookery/full-eval commit status on ${SHA}." >&2
            echo "Run Rookery full-eval for this SHA (Sentrook notify or Rookery workflow_dispatch), then retry." >&2
            echo "Or re-run with require_full_eval=false for an emergency bypass." >&2
            exit 1
          fi
          if [ "${state}" != "success" ]; then
            echo "rookery/full-eval is '${state}' (want success) for ${SHA}" >&2
            exit 1
          fi
          echo "rookery/full-eval=success for ${SHA}"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Avoid registry-url here — it can write a token-shaped .npmrc that
          # breaks OIDC Trusted Publishing. publishConfig.registry is enough.
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Ensure npm ≥ 11.5.1 (OIDC Trusted Publishing)
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm_ver="$(npm --version)"
          echo "npm ${npm_ver}"
          IFS=. read -r maj min pat _ <<< "${npm_ver}"
          if [ "${maj}" -lt 11 ] \
            || { [ "${maj}" -eq 11 ] && [ "${min}" -lt 5 ]; } \
            || { [ "${maj}" -eq 11 ] && [ "${min}" -eq 5 ] && [ "${pat}" -lt 1 ]; }; then
            echo "npm >= 11.5.1 required for Trusted Publishing, got ${npm_ver}" >&2
            exit 1
          fi

      - name: Install JS workspace
        run: npm ci

      - name: Assert publishConfig (public npmjs)
        working-directory: ${{ env.PLUGIN_DIR }}
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          registry="$(node -p "require('./package.json').publishConfig?.registry || ''")"
          access="$(node -p "require('./package.json').publishConfig?.access || ''")"
          if [[ "${name}" != @firstdataunion/sentrook-openclaw ]]; then
            echo "error: unexpected package name ${name}" >&2
            exit 1
          fi
          if [[ "${registry}" != "${NPMJS_REGISTRY}" ]]; then
            echo "error: publishConfig.registry must be ${NPMJS_REGISTRY} (got ${registry})" >&2
            exit 1
          fi
          if [[ "${access}" != "public" ]]; then
            echo "error: publishConfig.access must be public (got ${access})" >&2
            exit 1
          fi
          echo "Package ${name}@${version} → ${registry} (${access})"

      - name: Assert version matches channel
        id: meta
        working-directory: ${{ env.PLUGIN_DIR }}
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          is_prerelease=0
          if [[ "${version}" == *-* ]]; then
            is_prerelease=1
          fi
          if [[ "${CHANNEL}" == "latest" && "${is_prerelease}" == "1" ]]; then
            echo "error: channel=latest refuses prerelease version ${version}" >&2
            echo "    merge a stable Version PR (no -rc) first" >&2
            exit 1
          fi
          if [[ "${CHANNEL}" == "next" && "${is_prerelease}" != "1" ]]; then
            echo "error: channel=next requires a prerelease version (got ${version})" >&2
            echo "    enter Changesets pre mode (rc), open/merge a Version PR, then retry" >&2
            exit 1
          fi
          clawhub_tag=latest
          if [[ "${CHANNEL}" == "next" ]]; then
            clawhub_tag=beta
          fi
          {
            echo "name=${name}"
            echo "version=${version}"
            echo "tag=${CHANNEL}"
            echo "clawhub_tag=${clawhub_tag}"
          } >> "${GITHUB_OUTPUT}"
          echo "Will publish ${name}@${version} with dist-tag ${CHANNEL}"

      - name: Plugin tests + pack check
        run: make plugin-test

      - name: Pack the release artifact
        id: pack
        working-directory: ${{ env.PLUGIN_DIR }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/artifact"
          mkdir -p "${out}"
          npm pack --pack-destination "${out}" --loglevel=error >/dev/null
          tgz="$(ls "${out}"/*.tgz)"
          echo "tgz=${tgz}" >> "${GITHUB_OUTPUT}"
          echo "Packed $(basename "${tgz}") sha256=$(sha256sum "${tgz}" | cut -d' ' -f1)"

      - name: ClawHub validate
        working-directory: ${{ env.PLUGIN_DIR }}
        run: |
          set -euo pipefail
          # validate exits 0 even with findings: require none.
          npx -y "${CLAWHUB_CLI}" package validate . --out "${RUNNER_TEMP}/inspector" --json > "${RUNNER_TEMP}/validate.out"
          # shellcheck disable=SC2016 # the node script is JavaScript, its ${} are template literals
          node -e '
            const t = require("fs").readFileSync(process.argv[1], "utf8");
            const r = JSON.parse(t.slice(t.indexOf("{")));
            const s = r.summary || {};
            console.log(`Plugin Inspector: ${r.status} breakages=${s.breakageCount} warnings=${s.warningCount} issues=${s.issueCount}`);
            for (const i of r.issues || []) console.log(`- ${i.severity || ""} ${i.code || i.id || ""}: ${i.message || i.title || JSON.stringify(i)}`);
            if (String(r.status).toLowerCase() !== "pass" || s.issueCount !== 0) process.exitCode = 1;
          ' "${RUNNER_TEMP}/validate.out"

      - name: ClawHub dry-run publish
        env:
          TGZ: ${{ steps.pack.outputs.tgz }}
          CLAWHUB_TAG: ${{ steps.meta.outputs.clawhub_tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          npx -y "${CLAWHUB_CLI}" package publish "${TGZ}" --dry-run \
            --owner "${CLAWHUB_OWNER}" --tags "${CLAWHUB_TAG}" \
            --source-repo "${{ github.repository }}" --source-commit "${SHA}" --source-path "${PLUGIN_DIR}"

      - name: Publish to ClawHub
        id: clawhub
        if: ${{ inputs.clawhub && !inputs.dry_run }}
        env:
          TGZ: ${{ steps.pack.outputs.tgz }}
          CLAWHUB_TAG: ${{ steps.meta.outputs.clawhub_tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Trusted publishing: the CLI mints a publish token from the job's OIDC token (id-token: write).
          # --wait: fails on blocked / failed / expired, and on a release still pending at the deadline.
          npx -y "${CLAWHUB_CLI}" package publish "${TGZ}" \
            --owner "${CLAWHUB_OWNER}" --tags "${CLAWHUB_TAG}" \
            --source-repo "${{ github.repository }}" --source-commit "${SHA}" --source-path "${PLUGIN_DIR}" \
            --wait --wait-timeout 1800 --json > "${RUNNER_TEMP}/clawhub.out"
          # shellcheck disable=SC2016 # the node script is JavaScript, its ${} are template literals
          node -e '
            const t = require("fs").readFileSync(process.argv[1], "utf8");
            const r = JSON.parse(t.slice(t.indexOf("{")));
            console.log(`ClawHub ${r.name}@${r.version}: ${r.publicationStatus} release=${r.releaseId}`);
            for (const f of r.inspectorFindings || []) console.log(`- inspector: ${JSON.stringify(f)}`);
            const out = require("fs").createWriteStream(process.env.GITHUB_OUTPUT, { flags: "a" });
            out.write(`release_id=${r.releaseId || ""}\nstatus=${r.publicationStatus || ""}\nfindings=${(r.inspectorFindings || []).length}\n`);
            out.end();
            if (r.publicationStatus !== "published") process.exitCode = 1;
          ' "${RUNNER_TEMP}/clawhub.out"

      - name: Publish to npmjs
        if: ${{ !inputs.dry_run }}
        working-directory: ${{ env.PLUGIN_DIR }}
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          TGZ: ${{ steps.pack.outputs.tgz }}
        run: |
          set -euo pipefail
          # OIDC Trusted Publishing — no NPM_TOKEN / NODE_AUTH_TOKEN.
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          npm publish "${TGZ}" --access public --tag "${TAG}"

      - name: GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          release_tag="plugin-v${VERSION}"
          notes_file="$(mktemp)"
          {
            echo "## ${NAME}@${VERSION}"
            echo ""
            echo "- npm dist-tag: \`${TAG}\`"
            echo "- git SHA: \`${SHA}\`"
            echo ""
            if [[ -f "${PLUGIN_DIR}/CHANGELOG.md" ]]; then
              echo "### Changelog"
              echo ""
              # First ## section after the title (best-effort).
              awk '
                BEGIN { p=0 }
                /^## / {
                  if (p) exit
                  p=1
                  next
                }
                p { print }
              ' "${PLUGIN_DIR}/CHANGELOG.md"
            fi
            echo ""
            echo "Install:"
            if [[ "${TAG}" == "next" ]]; then
              echo "\`\`\`bash"
              echo "openclaw plugins install npm:${NAME}@next --pin --force"
              echo "\`\`\`"
            else
              echo "\`\`\`bash"
              echo "openclaw plugins install npm:${NAME}@${VERSION} --pin --force"
              echo "\`\`\`"
            fi
          } > "${notes_file}"
          gh release create "${release_tag}" \
            --title "${NAME}@${VERSION}" \
            --notes-file "${notes_file}" \
            --target "${SHA}"

      - name: Summary
        env:
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          DRY: ${{ inputs.dry_run }}
          SHA: ${{ github.sha }}
          CLAWHUB: ${{ inputs.clawhub }}
          CLAWHUB_TAG: ${{ steps.meta.outputs.clawhub_tag }}
          CLAWHUB_RELEASE: ${{ steps.clawhub.outputs.release_id }}
          CLAWHUB_STATUS: ${{ steps.clawhub.outputs.status }}
          CLAWHUB_FINDINGS: ${{ steps.clawhub.outputs.findings }}
        run: |
          set -euo pipefail
          {
            echo "## Plugin release"
            echo ""
            echo "- Package: \`${NAME}@${VERSION}\`"
            echo "- Dist-tag: \`${TAG}\`"
            echo "- SHA: \`${SHA}\`"
            if [[ "${DRY}" == "true" ]]; then
              echo "- Mode: **dry_run** (not published)"
            else
              echo "- Registry: ${NPMJS_REGISTRY}"
              echo "- GitHub Release: \`plugin-v${VERSION}\`"
            fi
            if [[ "${CLAWHUB}" == "true" && "${DRY}" != "true" ]]; then
              echo "- ClawHub: \`${CLAWHUB_TAG}\`, ${CLAWHUB_STATUS:-not published}, release \`${CLAWHUB_RELEASE:-none}\`, Plugin Inspector findings: ${CLAWHUB_FINDINGS:-?}"
            else
              echo "- ClawHub: validated and dry-run published as \`${CLAWHUB_TAG}\`, not published"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
