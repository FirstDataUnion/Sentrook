# OpenClaw plugin release: integrations/openclaw/plugin → one packed tarball, published to ClawHub and to public
# npmjs (@firstdataunion/sentrook-openclaw), and a GitHub Release plugin-v<version>. Manual only; merging to main
# and Changesets Version PRs never publish. The steps are integrations/openclaw/release/release.py.
#
#   build    (no secrets) refuses the release unless package.json's version equals PLUGIN_VERSION, the channel
#            fits the version and CHANGELOG.md has an entry for it; plugin tests and pack check; packs the
#            tarball once; ClawHub validate (no findings allowed) and a ClawHub --dry-run publish of that tarball.
#   compat   host-compat.yml on that exact tarball, on the declared floor and the latest stable OpenClaw:
#            OpenClaw's validator, install, verify and one agent turn. What is published is what was checked.
#   publish  (skipped on a dry run; Environment release-npm, approved by a person) checks the tarball is the one
#            packed (sha256), publishes it to ClawHub when clawhub=true and waits for ClawHub's security checks,
#            then npm with the channel's dist-tag, then the GitHub Release. A ClawHub release that is blocked,
#            fails, is still pending at the deadline, has a scan that is not clean or has Plugin Inspector findings
#            stops the job before npm; the job summary records the ClawHub release id and outcome either way.
#
# Releasing: a changeset with the change; merge the Version PR (it bumps package.json and PLUGIN_VERSION in planir.ts
# together and writes the CHANGELOG.md entry); dispatch this workflow, dry_run first if in doubt; approve Environment
# release-npm.
#
# Channels: a prerelease (2.x.y-beta.N) goes only to channel next: npm dist-tag next and ClawHub tag beta
# (`openclaw plugins install <name>@beta`). A stable version goes only to latest on both.
#
# Batching: ClawHub reviews automatically, so there is no fixed cadence; release when a change is ready. A security
# fix is released on its own (no other changes in the version), says so at the top of its CHANGELOG entry, and is
# dispatched with security_fix, which flags the GitHub Release title and the job summary.
#
# Auth: npm Trusted Publishing (OIDC), no NPM_TOKEN. Trusted Publisher on npmjs: org FirstDataUnion, repo
# Sentrook, workflow release-plugin.yml, environment release-npm.
# ClawHub: trusted publishing (OIDC, audience clawhub), no token. It can only be configured after one manual
# publish under the firstdataunion owner:
#   clawhub package trusted-publisher set @firstdataunion/sentrook-openclaw \
#     --repository FirstDataUnion/Sentrook --workflow-filename release-plugin.yml --environment release-npm
# Until then leave clawhub=false: without it the CLI finds no token and the job stops before npm.
# Re-running after ClawHub published (npm failed, or ClawHub finished after the wait): use clawhub=false, since
# ClawHub refuses the same version twice.
name: release-plugin

on:
  workflow_dispatch:
    inputs:
      channel:
        description: next = prerelease (npm next, ClawHub beta); latest = stable
        required: true
        type: choice
        options:
          - next
          - latest
      dry_run:
        description: Check, pack, validate and run the compatibility check; publish nothing
        required: false
        type: boolean
        default: false
      security_fix:
        description: A security fix, released on its own; flagged in the GitHub Release title and the summary
        required: false
        type: boolean
        default: false
      clawhub:
        description: Also publish to ClawHub (needs its trusted publisher, set after the first manual publish)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sentrook-release-plugin
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  NPMJS_REGISTRY: "https://registry.npmjs.org"
  PLUGIN_DIR: integrations/openclaw/plugin
  RELEASE_PY: integrations/openclaw/release/release.py
  CLAWHUB_CLI: "clawhub@0.25.1"
  CLAWHUB_OWNER: firstdataunion

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.meta.outputs.name }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      clawhub_tag: ${{ steps.meta.outputs.clawhub_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      # Before anything is built: one version, the channel, the CHANGELOG entry, public npmjs.
      - name: Version, channel and CHANGELOG entry
        id: meta
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          python3 "$RELEASE_PY" check --channel "$CHANNEL" --github-output "$GITHUB_OUTPUT"
          version=$(python3 "$RELEASE_PY" version)
          {
            echo "## CHANGELOG $version"
            echo
            python3 "$RELEASE_PY" changelog
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Install JS workspace
        run: npm ci

      - name: Plugin tests + pack check
        run: make plugin-test

      - name: Pack the release artifact
        run: python3 "$RELEASE_PY" pack --out "$RUNNER_TEMP/release"

      - name: ClawHub validate
        working-directory: ${{ env.PLUGIN_DIR }}
        run: |
          set -euo pipefail
          # validate exits 0 even with findings: the report is the gate.
          npx -y "${CLAWHUB_CLI}" package validate . --out "${RUNNER_TEMP}/inspector" --json > "${RUNNER_TEMP}/validate.out"
          python3 "${GITHUB_WORKSPACE}/${RELEASE_PY}" validate-report "${RUNNER_TEMP}/validate.out"

      - name: ClawHub dry-run publish
        env:
          CLAWHUB_TAG: ${{ steps.meta.outputs.clawhub_tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tgz=$(ls "$RUNNER_TEMP"/release/package/*.tgz)
          npx -y "${CLAWHUB_CLI}" package publish "${tgz}" --dry-run \
            --owner "${CLAWHUB_OWNER}" --tags "${CLAWHUB_TAG}" \
            --source-repo "${{ github.repository }}" --source-commit "${SHA}" --source-path "${PLUGIN_DIR}"

      - name: Keep the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openclaw-package
          path: ${{ runner.temp }}/release/package
          retention-days: 30

      - name: Keep the release record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openclaw-release
          path: ${{ runner.temp }}/release/release.json
          retention-days: 30

      - name: Summary
        env:
          DRY: ${{ inputs.dry_run }}
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          CLAWHUB_TAG: ${{ steps.meta.outputs.clawhub_tag }}
        run: |
          set -euo pipefail
          {
            echo "## Package"
            echo
            echo "- \`${NAME}@${VERSION}\`: $(jq -r '"\(.file), sha256 \(.sha256)"' "$RUNNER_TEMP/release/release.json")"
            echo "- Channel: npm \`${TAG}\`, ClawHub \`${CLAWHUB_TAG}\`"
            echo "- ClawHub validate: no findings; ClawHub dry-run publish accepted"
            if [ "$DRY" = true ]; then
              echo "- **Dry run:** the compatibility check runs on this package; nothing is published."
            fi
          } >>"$GITHUB_STEP_SUMMARY"

  # The plugin on real OpenClaw (the declared floor and the latest stable release), on the tarball about to be
  # published; see host-compat.yml.
  compat:
    needs: build
    uses: ./.github/workflows/host-compat.yml
    permissions:
      contents: read
    with:
      mode: release
      hosts: openclaw
      plugin-artifact: openclaw-package

  publish:
    needs: [build, compat]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: release-npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Avoid registry-url here — it can write a token-shaped .npmrc that
          # breaks OIDC Trusted Publishing. publishConfig.registry is enough.

      - name: Ensure npm ≥ 11.5.1 (OIDC Trusted Publishing)
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm_ver="$(npm --version)"
          echo "npm ${npm_ver}"
          IFS=. read -r maj min pat _ <<< "${npm_ver}"
          if [ "${maj}" -lt 11 ] \
            || { [ "${maj}" -eq 11 ] && [ "${min}" -lt 5 ]; } \
            || { [ "${maj}" -eq 11 ] && [ "${min}" -eq 5 ] && [ "${pat}" -lt 1 ]; }; then
            echo "npm >= 11.5.1 required for Trusted Publishing, got ${npm_ver}" >&2
            exit 1
          fi

      - name: The package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openclaw-package
          path: ${{ runner.temp }}/package

      - name: The release record
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openclaw-release
          path: ${{ runner.temp }}/record

      - name: The package is the one checked
        id: pkg
        run: |
          set -euo pipefail
          python3 "$RELEASE_PY" verify --release "$RUNNER_TEMP/record/release.json" --package "$RUNNER_TEMP/package"
          echo "tgz=$RUNNER_TEMP/package/$(jq -r .file "$RUNNER_TEMP/record/release.json")" >>"$GITHUB_OUTPUT"

      - name: Publish to ClawHub
        id: clawhub
        if: ${{ inputs.clawhub }}
        env:
          TGZ: ${{ steps.pkg.outputs.tgz }}
          NAME: ${{ needs.build.outputs.name }}
          VERSION: ${{ needs.build.outputs.version }}
          CLAWHUB_TAG: ${{ needs.build.outputs.clawhub_tag }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # Trusted publishing: the CLI mints a publish token from the job's OIDC token (id-token: write).
          # --wait: exits non-zero on blocked / failed / expired, and on a release still pending at the deadline.
          rc=0
          npx -y "${CLAWHUB_CLI}" package publish "${TGZ}" \
            --owner "${CLAWHUB_OWNER}" --tags "${CLAWHUB_TAG}" \
            --source-repo "${{ github.repository }}" --source-commit "${SHA}" --source-path "${PLUGIN_DIR}" \
            --wait --wait-timeout 1800 --json > "${RUNNER_TEMP}/clawhub.out" 2> "${RUNNER_TEMP}/clawhub.err" || rc=$?
          cat "${RUNNER_TEMP}/clawhub.err" >&2
          # The release's own security scan (clean | suspicious | malicious | pending | not-run).
          if [[ "${rc}" == "0" ]]; then
            npx -y "${CLAWHUB_CLI}" package inspect "${NAME}" --version "${VERSION}" --json \
              > "${RUNNER_TEMP}/clawhub-inspect.out" 2>/dev/null || true
          fi
          # shellcheck disable=SC2016 # the node script is JavaScript, its ${} are template literals
          node -e '
            const fs = require("fs");
            const json = (f) => { try { const t = fs.readFileSync(f, "utf8"); return JSON.parse(t.slice(t.indexOf("{"))); } catch { return null; } };
            const r = json(process.argv[1]) || {};
            const v = (json(process.argv[2]) || {}).version || {};
            const err = fs.readFileSync(process.argv[3], "utf8").trim().split("\n").pop() || "";
            const status = r.publicationStatus || (process.argv[4] === "0" ? "unknown" : "not published");
            const scan = (v.verification || {}).scanStatus || "unknown";
            const findings = (r.inspectorFindings || []).length;
            console.log(`ClawHub ${process.env.NAME}@${process.env.VERSION}: ${status}, scan ${scan}, release ${r.releaseId || "none"}, inspector findings ${findings}`);
            for (const f of r.inspectorFindings || []) console.log(`- inspector: ${JSON.stringify(f)}`);
            const why = status !== "published" ? (err || "the release was not published")
              : scan !== "clean" ? `security scan is ${scan}`
              : findings > 0 ? `${findings} Plugin Inspector finding(s)` : "";
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              `release_id=${r.releaseId || ""}\nstatus=${status}\nscan=${scan}\nfindings=${findings}\nstopped=${why.replace(/[\r\n]+/g, " ")}\n`);
            if (why) { console.error(`Stopping before npm: ${why}`); process.exitCode = 1; }
          ' "${RUNNER_TEMP}/clawhub.out" "${RUNNER_TEMP}/clawhub-inspect.out" "${RUNNER_TEMP}/clawhub.err" "${rc}"

      - name: Publish to npmjs
        env:
          TAG: ${{ needs.build.outputs.tag }}
          TGZ: ${{ steps.pkg.outputs.tgz }}
        run: |
          set -euo pipefail
          # OIDC Trusted Publishing — no NPM_TOKEN / NODE_AUTH_TOKEN.
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          npm publish "${TGZ}" --access public --tag "${TAG}"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.build.outputs.name }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ github.sha }}
          SECURITY_FIX: ${{ inputs.security_fix }}
        run: |
          set -euo pipefail
          title="${NAME}@${VERSION}"
          [ "$SECURITY_FIX" != true ] || title="Security fix: ${title}"
          notes_file="$(mktemp)"
          python3 "$RELEASE_PY" notes --release "$RUNNER_TEMP/record/release.json" > "${notes_file}"
          gh release create "plugin-v${VERSION}" \
            --title "${title}" \
            --notes-file "${notes_file}" \
            --target "${SHA}"

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          NAME: ${{ needs.build.outputs.name }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ github.sha }}
          CLAWHUB: ${{ inputs.clawhub }}
          CLAWHUB_TAG: ${{ needs.build.outputs.clawhub_tag }}
          CLAWHUB_RELEASE: ${{ steps.clawhub.outputs.release_id }}
          CLAWHUB_STATUS: ${{ steps.clawhub.outputs.status }}
          CLAWHUB_FINDINGS: ${{ steps.clawhub.outputs.findings }}
          CLAWHUB_SCAN: ${{ steps.clawhub.outputs.scan }}
          CLAWHUB_STOPPED: ${{ steps.clawhub.outputs.stopped }}
          JOB_STATUS: ${{ job.status }}
          SECURITY_FIX: ${{ inputs.security_fix }}
        run: |
          set -euo pipefail
          {
            echo "## Plugin release"
            echo ""
            if [[ "${SECURITY_FIX}" == "true" ]]; then
              echo "**Security fix.**"
              echo ""
            fi
            echo "- Package: \`${NAME}@${VERSION}\`"
            echo "- Dist-tag: \`${TAG}\`"
            echo "- SHA: \`${SHA}\`"
            if [[ "${JOB_STATUS}" != "success" ]]; then
              echo "- **The release stopped early.** Steps after the failed one did not run: check npm and the GitHub Release before re-running."
            fi
            echo "- Registry: ${NPMJS_REGISTRY}"
            echo "- GitHub Release: \`plugin-v${VERSION}\`"
            if [[ "${CLAWHUB}" == "true" ]]; then
              echo "- ClawHub: \`${CLAWHUB_TAG}\`, ${CLAWHUB_STATUS:-not reached}, scan ${CLAWHUB_SCAN:-unknown}, release \`${CLAWHUB_RELEASE:-none}\`, Plugin Inspector findings: ${CLAWHUB_FINDINGS:-?}"
              if [[ -n "${CLAWHUB_STOPPED}" ]]; then
                echo "- **Stopped before npm:** ${CLAWHUB_STOPPED}"
              fi
            else
              echo "- ClawHub: validated and dry-run published as \`${CLAWHUB_TAG}\`, not published (clawhub=false)"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
