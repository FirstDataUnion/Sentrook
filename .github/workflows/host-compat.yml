# Host plugins against real host releases. For each host (Hermes, OpenClaw) and each pinned version in
# integrations/<host>/compat/versions.txt (the plugin's declared floor and the latest stable release),
# integrations/<host>/compat/run.sh runs the host's own plugin checks, installs the plugin as a user
# would, sets the scan credentials through the host, runs verify and status against mock identity and
# scan services, and drives one agent turn in which the plugin must block one tool call and allow the
# next. Any failed step, or a host report not in the host's warnings-baseline.txt, fails the job.
#
# - Pull requests touching a plugin or this tooling: for each host whose plugin changed (every host when
#   the shared tooling changed; OpenClaw also when the root package files, its build tools, changed), the pinned versions (blocking), the check's self-test (blocking: it
#   proves the check still catches a broken plugin), and the newest pre-release (a Hermes release
#   candidate, an OpenClaw beta) when it is newer than the latest stable (report-only). Pushes to main
#   run every host.
# - The release workflows call it with mode `release` and their host: the pinned versions only, blocking,
#   on the tree they are about to publish when they pass it as `plugin-artifact`.
# - The nightly canary against the host's main build, and the bump to each new stable release, are in
#   host-compat-nightly.yml.
#
# Runs on the public repo without secrets: the mock services use synthetic hosts and credentials.
name: host-compat

on:
  pull_request:
    paths:
      - integrations/hermes/**
      - integrations/openclaw/**
      - integrations/compat/**
      - package.json
      - package-lock.json
      - .github/workflows/host-compat.yml
  push:
    branches: [main]
    paths:
      - integrations/hermes/**
      - integrations/openclaw/**
      - integrations/compat/**
      - package.json
      - package-lock.json
      - .github/workflows/host-compat.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "pr: pinned versions, self-test and pre-release; release: pinned versions only"
        type: choice
        options: [pr, release]
        default: pr
      hosts:
        description: "hosts to check, space-separated (empty: all)"
        type: string
        default: ""
  workflow_call:
    inputs:
      mode:
        description: "pr or release (see workflow_dispatch)"
        type: string
        default: release
      hosts:
        description: "hosts to check, space-separated (empty: all)"
        type: string
        default: ""
      plugin-artifact:
        description: >-
          an artifact of the calling run holding the plugin tree to check instead of the checkout's (the
          release workflow's assembled mirror tree); give one host in `hosts`
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: host-compat-${{ inputs.mode || 'pr' }}-${{ inputs.hosts }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HOSTS: hermes openclaw

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      blocking: ${{ steps.plan.outputs.blocking }}
      latest: ${{ steps.plan.outputs.latest }}
      rc: ${{ steps.plan.outputs.rc }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request is checked out as its merge commit: parent 1 is the base branch.
          fetch-depth: 2

      - name: Versions under test
        id: plan
        env:
          MODE: ${{ inputs.mode || 'pr' }}
          ONLY: ${{ inputs.hosts }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          hosts=${ONLY:-$HOSTS}
          # A pull request checks only the hosts whose plugin it changes, unless it changes the shared tooling.
          if [ "$EVENT" = pull_request ]; then
            if changed=$(git diff --name-only HEAD^1 HEAD); then
              if ! grep -qE '^(integrations/compat/|\.github/workflows/host-compat\.yml$)' <<<"$changed"; then
                picked=''
                for host in $hosts; do
                  # The root package files hold the OpenClaw plugin's build tools (an npm workspace).
                  pattern="^integrations/$host/"
                  [ "$host" != openclaw ] || pattern="$pattern|^package(-lock)?\.json$"
                  if grep -qE "$pattern" <<<"$changed"; then picked="$picked $host"; fi
                done
                hosts=${picked# }
              fi
            else
              echo "::warning::could not list the pull request's changes; checking every host"
            fi
          fi
          echo "hosts: ${hosts:-none}"
          blocking='[]'; latest='[]'; rc='[]'
          for host in $hosts; do
            b=$(python3 integrations/compat/compat.py matrix --host "$host" --set blocking)
            blocking=$(jq -c --argjson b "$b" '. + $b' <<<"$blocking")
            latest=$(jq -c --argjson b "$b" '. + [$b[-1]]' <<<"$latest")
            if [ "$MODE" = pr ]; then
              # Report-only: a registry outage must not fail the pull request.
              r=$(python3 integrations/compat/compat.py matrix --host "$host" --set rc || echo '[]')
              rc=$(jq -c --argjson r "$r" '. + $r' <<<"$rc")
            fi
          done
          [ "$MODE" = pr ] || latest='[]'
          # A release must be checked: an empty set would skip the check and read as a pass.
          if [ "$MODE" = release ] && [ "$blocking" = '[]' ]; then
            echo "release mode with nothing to check (hosts: ${hosts:-none})" >&2
            exit 1
          fi
          {
            echo "blocking=$blocking"
            echo "latest=$latest"
            echo "rc=$rc"
          } >>"$GITHUB_OUTPUT"
          echo "blocking: $blocking"; echo "self-test: $latest"; echo "pre-release: $rc"

  compat:
    needs: plan
    if: needs.plan.outputs.blocking != '[]'
    name: ${{ matrix.host }} ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.blocking) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        if: matrix.host == 'openclaw'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Pull ${{ matrix.image }}
        run: docker pull -q "${{ matrix.image }}"

      # A release checks the exact tree it is about to tag, not the plugin directory.
      - name: Download the plugin tree to check
        if: inputs.plugin-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.plugin-artifact }}
          path: ${{ runner.temp }}/plugin-tree

      - name: Compatibility check
        env:
          PLUGIN_TREE: ${{ inputs.plugin-artifact != '' && format('{0}/plugin-tree', runner.temp) || '' }}
        run: integrations/${{ matrix.host }}/compat/run.sh "${{ matrix.image }}" "$PLUGIN_TREE" "$RUNNER_TEMP/compat"

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compat-${{ matrix.host }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/compat
          retention-days: 14

  # The check must still fail on a broken plugin (see each host's selftest.sh): for Hermes a declared hook
  # never registered, an unknown config type and a refused token mint; for OpenClaw an unknown hook name, a
  # refused token mint and a missing host field.
  self-test:
    needs: plan
    if: needs.plan.outputs.latest != '[]'
    name: ${{ matrix.host }} self-test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.latest) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        if: matrix.host == 'openclaw'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Pull ${{ matrix.image }}
        run: docker pull -q "${{ matrix.image }}"

      - name: The check fails where it should
        run: integrations/${{ matrix.host }}/compat/selftest.sh "${{ matrix.image }}"

  release-candidate:
    needs: plan
    if: needs.plan.outputs.rc != '[]'
    name: ${{ matrix.host }} ${{ matrix.name }} (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.rc) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        if: matrix.host == 'openclaw'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      # On the steps, not the job, so a failing pre-release leaves a warning rather than a red check.
      - name: Pull ${{ matrix.image }}
        continue-on-error: true
        run: docker pull -q "${{ matrix.image }}"

      - name: Compatibility check
        continue-on-error: true
        run: |
          if ! integrations/${{ matrix.host }}/compat/run.sh "${{ matrix.image }}" "" "$RUNNER_TEMP/compat"; then
            echo "::warning::${{ matrix.image }} fails the compatibility check (report-only; the next release may break the plugin)"
            exit 1
          fi

  # One check with a fixed name for branch protection: the per-version job names change with each bump.
  result:
    needs: [plan, compat, self-test]
    if: always()
    name: host-compat result
    runs-on: ubuntu-latest
    steps:
      - name: Pinned versions and self-test passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # self-test is skipped in release mode, and both are skipped when no host's plugin changed;
          # everything that ran must succeed.
          echo "$RESULTS" | jq -e '(.plan.result == "success")
            and ((.compat.result == "success")
              or (.compat.result == "skipped" and .plan.outputs.blocking == "[]"))
            and (.["self-test"].result == "success" or .["self-test"].result == "skipped")' >/dev/null
