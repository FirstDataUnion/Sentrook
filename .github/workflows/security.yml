# Phase 2 — secrets, SCA, SAST. Fail closed on HIGH/CRITICAL (or Semgrep ERROR+).
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly Monday 06:17 UTC

permissions:
  contents: read

concurrency:
  group: sentrook-security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks
        run: |
          set -euo pipefail
          docker run --rm -v "${PWD}:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source=/repo --config=/repo/.gitleaks.toml \
            --verbose --redact --exit-code=1

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint
        run: |
          set -euo pipefail
          docker run --rm -v "${PWD}:/repo" -w /repo \
            rhysd/actionlint:1.7.7 \
            -color

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy filesystem (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Semgrep (ERROR+)
        run: |
          set -euo pipefail
          docker run --rm -v "${PWD}:/src" -w /src \
            semgrep/semgrep:1.128.1 \
            semgrep scan \
              --config p/python \
              --config p/javascript \
              --config p/owasp-top-ten \
              --severity ERROR \
              --error \
              --metrics=off

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Private repos: analyze upload calls workflow-runs API (get-a-workflow-run).
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep init/analyze on the same CodeQL Action revision — mixed pins fail with
      # "Loaded a configuration file for version X, but running version Y".
      # Python + JS/TS need no compile step; autobuild is for compiled languages.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: javascript-typescript, python
          queries: security-extended
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:python-js"
          upload: true
          output: codeql-sarif

      - name: Fail on CodeQL HIGH/CRITICAL
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, pathlib, sys
          root = pathlib.Path("codeql-sarif")
          files = list(root.glob("*.sarif")) if root.is_dir() else list(pathlib.Path(".").glob("**/*.sarif"))
          if not files:
              print("No SARIF files found under codeql-sarif/; skipping fail gate", file=sys.stderr)
              sys.exit(0)
          bad = []
          for path in files:
              data = json.loads(path.read_text())
              for run in data.get("runs", []):
                  rules = {r.get("id"): r for r in run.get("tool", {}).get("driver", {}).get("rules", [])}
                  for res in run.get("results", []):
                      rule = rules.get(res.get("ruleId"), {})
                      props = rule.get("properties", {})
                      sev = (props.get("security-severity") or props.get("problem.severity") or "").strip()
                      level = (res.get("level") or rule.get("defaultConfiguration", {}).get("level") or "").lower()
                      try:
                          sev_f = float(sev) if sev else 0.0
                      except ValueError:
                          sev_f = 0.0
                      # CodeQL security-severity: 9.0+ critical, 7.0+ high
                      if sev_f >= 7.0 or level in {"error", "critical"}:
                          bad.append(f"{path.name}: {res.get('ruleId')} severity={sev or level}")
          if bad:
              print("CodeQL HIGH/CRITICAL findings:", file=sys.stderr)
              print("\n".join(bad[:50]), file=sys.stderr)
              sys.exit(1)
          print(f"Checked {len(files)} SARIF file(s): no HIGH/CRITICAL findings")
          PY
