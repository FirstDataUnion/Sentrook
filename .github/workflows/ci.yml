# Phase 1 public-ready CI for Sentrook.
# Does NOT check out Rookery, run sanitize-gate, or run test-engine.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["*"]

permissions:
  contents: read

concurrency:
  group: sentrook-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install (dev)
        run: |
          uv venv .venv
          source .venv/bin/activate
          make install-dev

      - name: Lint
        run: make lint

  test-sentrook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install (dev)
        run: |
          uv venv .venv
          source .venv/bin/activate
          make install-dev

      - name: Unit tests (sentrook)
        run: make test-sentrook

  test-testnest-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install (dev)
        run: |
          uv venv .venv
          source .venv/bin/activate
          make install-dev

      - name: Unit tests (testnest harness)
        run: make test-testnest

  testnest-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install (dev)
        run: |
          uv venv .venv
          source .venv/bin/activate
          make install-dev

      - name: DEMO smoke TestNest
        run: make smoke

  test-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: integrations/openclaw/plugin/package-lock.json

      - name: Install plugin deps
        working-directory: integrations/openclaw/plugin
        run: npm ci

      - name: Plugin tests + pack check
        run: make plugin-test

  notify-rookery:
    # Push to main / tags only — non-blocking private full-eval visibility.
    # PRs merge on Sentrook CI; full-eval is a release gate (manual dispatch OK).
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    needs:
      - lint-python
      - test-sentrook
      - test-testnest-unit
      - testnest-smoke
      - test-plugin
    permissions:
      contents: read
    steps:
      - name: Dispatch Rookery full-eval
        env:
          ROOKERY_DISPATCH_TOKEN: ${{ secrets.ROOKERY_DISPATCH_TOKEN }}
          SENTROOK_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${ROOKERY_DISPATCH_TOKEN}" ]; then
            echo "ROOKERY_DISPATCH_TOKEN unset — dispatch skipped (secret not provisioned)"
            exit 0
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer ${ROOKERY_DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/FirstDataUnion/Rookery/dispatches" \
            -d "{\"event_type\":\"sentrook-eval\",\"client_payload\":{\"sentrook_sha\":\"${SENTROOK_SHA}\"}}"
          echo "Dispatched sentrook-eval for ${SENTROOK_SHA}"
