# Unit tests and lint for the Sentrook 2.0 scanner. Runs on the public repo without secrets.
# A gate that runs the full TestNest suite needs private fixtures, so it is not part of this workflow yet.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["*"]

permissions:
  contents: read

concurrency:
  group: sentrook-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        run: make install

      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        run: make install

      - name: Schema files match the models
        run: make schema-check

      # Fails a hand edit of redact_shapes.yaml, or a GITLEAKS_TAG moved without regenerating.
      - name: Redaction shapes match gitleaks at the pinned tag
        run: make redact-shapes-check

      - name: Unit tests
        run: make test
