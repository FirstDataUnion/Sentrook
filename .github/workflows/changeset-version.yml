# Open a Version PR for the OpenClaw plugin when changesets land on main.
# Does NOT publish to npm — that is release-plugin.yml + Environment release-npm.
name: changeset-version

on:
  push:
    branches: [main]
    paths:
      - ".changeset/**"
      - "package.json"
      - "package-lock.json"
      - "integrations/openclaw/plugin/package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentrook-changeset-version
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JS workspace
        run: npm ci

      - name: Open Version PR (no npm publish)
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: npm run version
          title: "Version @firstdataunion/sentrook-openclaw"
          commit: "chore(plugin): version package"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
