# Trivy secret-scanning configuration.
#
# Picked up automatically: trivy reads `trivy-secret.yaml` from the scan
# directory by default, so this needs no workflow wiring.
#
# `allow-rules` with a `path` excludes those files from **every** secret rule,
# current and future. That is deliberate. The first attempt at this enumerated
# rule ids (`stripe-access-token`, `aws-secret-access-key`, …) and was wrong
# twice over: the real id is `stripe-secret-token`, and `gitlab-pat` was missed
# entirely. Guessing at a vendor's rule names is a loop, and every new provider
# rule trivy ships would reopen it.
#
# Scoped to three named fixture files. Nothing broader — if a real credential is
# ever committed to source, this must still catch it.
allow-rules:
  - id: sentrook-redaction-fixtures
    description: >-
      Parity fixtures that deliberately embed secret-shaped strings. Sentrook's
      job is detecting secrets, so these files exist precisely to assert that
      such strings get redacted. A scanner finding them is the fixture working.
      Cross-checked by `fixtures/secret_redaction_golden.jsonl` itself, which
      asserts each input scrubs to a placeholder.
    path: (^|/)fixtures/(secret_redaction_golden|exec_shape_golden|marker_linkage_golden)\.jsonl$
