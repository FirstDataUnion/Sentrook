# Vendor key shapes for the scanner's second redaction pass (`prepare.redact`).
#
# Each shape is a regex for one vendor's key format; the pass puts a boundary in front (no letter or
# digit right before) and replaces every match with the placeholder. `min_length` is the shortest
# string the regex matches. The generic shapes (PEM, JWT, Authorization: Bearer, assignment forms)
# are in code, not here.
#
# Entries with `source: sentrook` are kept by hand. Entries with `source: gitleaks` are generated by
#   sentrook redact-shapes import --tag <tag>     (make redact-shapes)
# from the gitleaks default rules at the tag under `upstream`; do not edit them by hand. A change in
# what the pass masks needs a new REDACTION_VERSION in prepare/redact.py.
#
# The gitleaks-derived entries are adapted from gitleaks (https://github.com/gitleaks/gitleaks),
# config/gitleaks.toml, under the MIT License:
