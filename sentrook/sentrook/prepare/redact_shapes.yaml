    regex: 'shppa_[a-fA-F0-9]{32}'
    min_length: 38
    source: gitleaks
    source_version: v8.30.1
  - name: shopify-shared-secret
    regex: 'shpss_[a-fA-F0-9]{32}'
    min_length: 38
    source: gitleaks
    source_version: v8.30.1
  - name: slack-bot-token
    regex: 'xoxb-[0-9]{10,13}-[0-9]{10,13}[a-zA-Z0-9-]{0,4096}'
    min_length: 26
    source: gitleaks
    source_version: v8.30.1
  - name: slack-config-access-token
    regex: '(?i:xoxe.xox[bp]-\d-[A-Z0-9]{163,166})'
    min_length: 175
    source: gitleaks
    source_version: v8.30.1
  - name: slack-config-refresh-token
    regex: '(?i:xoxe-\d-[A-Z0-9]{146})'
    min_length: 153
    source: gitleaks
    source_version: v8.30.1
  - name: slack-legacy-bot-token
    regex: 'xoxb-[0-9]{8,14}-[a-zA-Z0-9]{18,26}'
    min_length: 32
    source: gitleaks
    source_version: v8.30.1
  - name: slack-user-token
    regex: 'xox[pe](?:-[0-9]{10,13}){3}-[a-zA-Z0-9-]{28,34}'
    min_length: 66
    source: gitleaks
    source_version: v8.30.1
  - name: square-access-token
    regex: '(?:EAAA|sq0atp-)[\w-]{22,60}'
    min_length: 26
    source: gitleaks
    source_version: v8.30.1
  - name: stripe-access-token
    regex: '(?:sk|rk)_(?:test|live|prod)_[a-zA-Z0-9]{10,99}'
    min_length: 18
    source: gitleaks
    source_version: v8.30.1
  - name: typeform-api-token
    regex: '(?i:tfp_[a-z0-9\-_\.=]{59})'
    min_length: 63
    source: gitleaks
    source_version: v8.30.1
  - name: vault-batch-token
    regex: 'hvb\.[\w-]{138,300}'
    min_length: 142
    source: gitleaks
    source_version: v8.30.1
  - name: yandex-access-token
    regex: '(?i:t1\.[A-Z0-9a-z_-]{1,4096}[=]{0,2}\.[A-Z0-9a-z_-]{86}[=]{0,2})'
    min_length: 91
    source: gitleaks
    source_version: v8.30.1
  - name: yandex-api-key
    regex: '(?i:AQVN[A-Za-z0-9_\-]{35,38})'
    min_length: 39
    source: gitleaks
    source_version: v8.30.1

