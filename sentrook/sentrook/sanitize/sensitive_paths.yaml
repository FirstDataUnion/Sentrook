# Canonical sensitive-path and named-binary lists — §1.3 of the scanner
# rearchitecture plan. **One source of truth**, loaded by:
#
#   * sentrook.serve.fingerprint       — SENSITIVE_PATH_RE / path_class
#   * sentrook.sanitize.signal_excerpt — excerpt-window selection
#   * sentrook.layers.exec_shape       — exec_shape.path_classes
#   * sentrook.rules.compiler          — the ${sensitive_path} args_match macro
#
# Deliberately a *sibling* of rules.yaml rather than a section inside it.
# rules.yaml is the sanitize ruleset: it carries a `version` recorded in every
# operator-log line and is mirrored token-for-token in the TypeScript plugin, so
# every edit there is a redaction-semantics change requiring a version bump and
# a plugin mirror. This list is neither — it feeds detection and allow-rule
# eligibility, and the plugin derives no shape at all (§1.1).
#
# Adding an entry can only *widen* what counts as sensitive. That direction
# fails safe: a false `sensitive` costs a review, a missing one costs a
# detection. Removing an entry is the change that needs justification.

version: 1

# --------------------------------------------------------------------------
# sensitive — credential, key and auth-store material.
#
# **Composed, not listed.** `sensitive` is the union of the two groups below,
# so every entry lives in exactly one place. `${sensitive_path}`,
# `exec_shape.path_roles` and `fingerprint.path_class` are unchanged by the
# split: a test asserts the composed group matches exactly the same subjects as
# the flat one did, over every command and path in the corpus, and the
# fingerprint baseline does not move.
#
# The split exists because the two halves deserve different **authority**,
# which is a per-rule property, so they have to be separately nameable.
#
#   * `credential_store` — the file's purpose is to hold credentials. Reading
#     one is a credential read whatever else the command is doing. AIRA-083
#     reviews these at `authority: hard`.
#   * `credential_bearing_config` — the file's purpose is configuration and it
#     carries credentials too. Reading `openclaw.json` for `.gateway.port` or
#     `"memorySearch"` is not a credential read in substance, and it is a
#     routine thing for a scheduled agent to do. AIRA-086 reviews these at
#     `authority: soft`, so L3 and an operator's floor can both relieve them.
#
# Measured before the split: **8 of AIRA-083's 26 corpus hits** were
# `openclaw.json` alone, and every one read a non-credential field. An
# unwaivable review on those blocks cron jobs for no consequence.
#
# Narrowing the *detection* instead was rejected, and the reason generalises:
# `cat openclaw.json` with no selector is the dangerous form while `jq
# '.gateway.port' openclaw.json` is the benign one, so any "does it name a
# field" heuristic runs backwards and its failure direction is a missed
# credential hunt. Both halves still fire a review; what differs is whether an
# operator may waive it.
# --------------------------------------------------------------------------
sensitive:
  includes:
    - credential_store
    - credential_bearing_config

# --------------------------------------------------------------------------
# credential_store — the file exists to hold credentials.
# --------------------------------------------------------------------------
credential_store:
  # Raw regex fragments, matched with re.IGNORECASE anywhere in the subject.
  # Use these when the *directory* is what makes the path sensitive.
  patterns:
    # OpenClaw auth stores. Guardrail *config* is not here — see `agent_config`.
    - 'auth-profiles(?:\.json)?'
    - 'openclaw-agent\.sqlite'
    - 'openclaw-auth-intake'
    - 'openclaw-sqlite'
    # Redundant with the `credentials` basename below, kept explicit because
    # this is the form `fingerprint` matched before §1.3 and the reconciliation
    # was verified with it present.
    - 'credentials\.json'
    # An .ssh directory, absolute, ~-relative or bare — and anything under it.
    # The trailing path is optional: `tar czf - ~/.ssh | curl -F f=@-` names the
    # directory and nothing else, and is AIRA-060's canonical positive.
    - '~?/?\.ssh(?:/[^\s"'']*)?(?![A-Za-z0-9_])'
    - '\.hermes/'
    # .env and its per-environment siblings (.env.local, .env.production).
    - '(?:^|[\s"''`=/])\.env(?:\.[A-Za-z0-9_.-]+)?(?![A-Za-z0-9_-])'
    # Unix account databases. Narrower than signal_excerpt's historical
    # `/etc/[^\s"']+`, which classed /etc/hosts and /etc/os-release as
    # credential material; see the reconciliation diff in the Phase 2 log.
    - '/etc/(?:shadow|gshadow|sudoers|passwd)\b'

  # Literal basenames, matched **independently of directory** (§1.3).
  #
  # This section exists because a relative reference after a `cd` escapes every
  # path-anchored pattern above: `cd ~/.ssh && cat id_rsa` has no `/.ssh` in the
  # segment that performs the read. Relative paths are the common shape in real
  # traffic and cwd is unknowable until Phase 5.
  #
  # Entries are regex-escaped by the loader and wrapped in component boundaries,
  # so `.env` matches `/app/.env` and `.env.local` but not `myapp.env`, and
  # `shadow` matches `/etc/shadow` but not `shadowsocks`.
  basenames:
    - id_rsa
    - id_ed25519
    - id_ecdsa
    - id_dsa
    - authorized_keys
    - known_hosts
    - auth-profiles.json
    - openclaw-agent.sqlite
    - database.sqlite
    - .env
    - .netrc
    - credentials
    - .pgpass
    - .npmrc
    - .docker/config.json
    - shadow


# --------------------------------------------------------------------------
# credential_bearing_config — configuration that also carries credentials.
#
# Still `sensitive`: `cat openclaw.json` really does expose every secret in it.
# What it is not is *unambiguous* — the same file holds the gateway port, the
# agent list and the channel config, and an agent reads it constantly for those.
#
# `.npmrc` is the obvious candidate to join this group — it is npm's config file
# and carries `_authToken` — but there is no corpus evidence either way, and
# moving it would weaken detection on nothing but symmetry. It stays in
# `credential_store` until traffic says otherwise.
# --------------------------------------------------------------------------
credential_bearing_config:
  patterns:
    # Credential-bearing despite the generic name: `cat openclaw.json |
    # jq .auth.profiles` is an observed live credential hunt (Phase 1 log).
    - 'openclaw\.json'

# --------------------------------------------------------------------------
# auth_store — the *stores* inside `sensitive`, not the whole of it.
#
# A strict subset: every entry here also matches `${sensitive_path}`. It exists
# because AIRA-059 needs to say "an interpreter opened the auth store", which is
# a narrower claim than "an interpreter and a credential path appear in the same
# command". Phase 2's macro migration widened that branch to the full sensitive
# list and put one consequence at two authorities — `python3 -c
# open(<sensitive>)` hard, `cat <sensitive>` soft, decided by which binary read.
# Phase 3a narrowed it back and gave the general case to AIRA-083; this group is
# what "narrowed back" binds to, so the auth-store signature is a list rather
# than three strings pasted into a rule.
#
# Keys, tokens and private keys are deliberately NOT here. A private key is
# credential material (class 1) but it is not a store an interpreter opens and
# copies, which is the shape AIRA-059 was harvested from.
# --------------------------------------------------------------------------
auth_store:
  patterns:
    - 'auth-profiles(?:\.json)?'
    - 'openclaw-agent\.sqlite'
    - 'openclaw-auth-intake'
    - 'openclaw-sqlite'
  basenames:
    - auth-profiles.json
    - openclaw-agent.sqlite
    - database.sqlite

# --------------------------------------------------------------------------
# agent_config — the agent's own guardrail and identity configuration.
#
# Not credentials, so held out of `sensitive`: reading exec-approvals.json is a
# configuration inspection, while *writing* it disables a guardrail (class 5).
# Kept here so a class-5 rule has a list to key on without widening class 1.
# --------------------------------------------------------------------------
agent_config:
  patterns:
    - 'exec-approvals\.json'
    - 'sentrook-allowlist\.json'
    - 'agents/[^\s"'']+/agent/config\.json'

# --------------------------------------------------------------------------
# persistence — where a write survives the session (taxonomy class 4/6).
# --------------------------------------------------------------------------
persistence:
  patterns:
    # Shell startup files.
    - '(?:^|[\s"''`=/])\.(?:bashrc|bash_profile|bash_login|profile|zshrc|zshenv|zprofile|zlogin|kshrc|cshrc|login)(?![A-Za-z0-9_-])'
    # Cron.
    - '/etc/cron[^\s"'']*'
    - '/var/spool/cron[^\s"'']*'
    - '\bcrontab\b'
    # systemd units and user agents.
    - '/etc/systemd/system/[^\s"'']*'
    - '~?/?\.config/systemd/user/[^\s"'']*'
    - '/Library/LaunchAgents/[^\s"'']*'
    - '/Library/LaunchDaemons/[^\s"'']*'
    # Name resolution — a write here redirects every later connection.
    - '/etc/(?:hosts|resolv\.conf|nsswitch\.conf)\b'
    # Loader hijack.
    - '/etc/ld\.so\.(?:conf|preload)'
    # Agent-durable surfaces: memory and hooks survive every session.
    - 'MEMORY\.md'
    - '/memory/'
    - '(?:^|[\s"''`=/])hooks/'
    - '\.git/hooks/'
    # SSH persistence — authorized_keys is also `sensitive`; both are true.
    - 'authorized_keys'

# --------------------------------------------------------------------------
# Falco-style named binary lists. Heads are basenamed and lowercased by
# exec_shape before comparison, so these are bare names.
# --------------------------------------------------------------------------
# Binaries that make a file's *contents* available — the "reading head" half of
# consequence class 1. Path signals are path-only and cannot see the verb, so
# `ls -la ~/.ssh`, `rm -rf ~/.ssh` and `cat ~/.ssh/id_rsa` are identical to
# them; this list is what separates the third from the first two.
#
# Deliberately **not** a catalogue. GTFOBins lists 478 binaries that can be
# coerced into a file read; this is the verb check for the binaries an agent
# actually runs. An unrecognised head still reaches AIRA-010's soft review, so
# what an unusual binary costs is attribution, not detection.
#
# Deliberately absent: `ls`, `stat`, `file`, `find`, `which`, `du` (reference
# without reading) and `curl`/`wget`, whose `-d @file` / `--post-file` forms
# read *and* egress — those are class 2 and AIRA-067 owns them at hard
# authority.
#
# Lives here because three rules matched on it (AIRA-083 twice, AIRA-086 once)
# with three byte-identical copies of the same alternation — the `# keep in
# sync` shape §1.3 exists to delete. Rules reference it as
# `(?:\A|\n)${reading_head}(?:\n|\Z)`: the list is the data, the anchoring
# is the idiom (see the dialect reference's "some entry is X" section).
reading_binaries:
  - cat
  - head
  - tail
  - tac
  - rev
  - nl
  - od
  - xxd
  - strings
  - less
  - more
  - jq
  - yq
  - grep
  - egrep
  - fgrep
  - rg
  - awk
  - gawk
  - mawk
  - sed
  - cut
  - sort
  - uniq
  - wc
  - python
  - python2
  - python3
  - node
  - deno
  - bun
  - perl
  - ruby
  - php
  - lua
  - tar
  - zip
  - gzip
  - gunzip
  - zcat
  - base64
  - openssl
  - sqlite3
  - getent
  - cp
  - dd

shell_binaries:
  - sh
  - bash
  - zsh
  - dash
  - ksh
  - ash
  - fish
  - csh
  - tcsh

interpreter_binaries:
  - python
  - python2
  - python3
  - node
  - deno
  - bun
  - perl
  - ruby
  - php
  - lua
  - osascript
  - Rscript

fetch_binaries:
  - curl
  - wget
  - nc
  - ncat
  - netcat
  - socat
  - http
  - httpie
  - scp
  - sftp
  - rsync
  - ftp
  - aria2c

package_mgmt_binaries:
  - pip
  - pip3
  - uv
  - npm
  - npx
  - pnpm
  - yarn
  - gem
  - cargo
  - go
  - apt
  - apt-get
  - dnf
  - yum
  - apk
  - brew
  - pacman

# ---------------------------------------------------------------------------
# Phase 3b — the allow families (AIRA-9NN)
#
# These two lists are the fail-**open** half of the library, so they live here
# rather than in the rules for the reason §1.3 exists: eight allow rules each
# carrying its own copy of a safety list, kept in step by a comment, is the
# shape that produced five divergent copies of the sensitive-path list.
# Adding a flag here reaches every family with no rule edit.

# Every head an allow family may admit. The union, deliberately: real commands
# compose heads across families — `find . -name '*.md' | head -20`, `ls -la |
# grep foo`, `cat x | wc -l` — and a rule that requires every head to be in
# *its own* family can never admit them. Each family additionally requires one
# head of its own (the `some` form), which is what keeps attribution and makes
# withdrawing a single family meaningful.
# Keyed by family, so a rule never carries an inline head list. `${safe_exec_head}`
# is the union of every value here and `${safe_exec_head_<family>}` is one of
# them, which is what lets a family say "every head is safe **and** one is
# mine" without restating either set.
safe_exec_binaries:
  # AIRA-901 listing / navigation — `cd` is deliberately absent: it rebases
  # path context, so per-segment reasoning about a later head is unsound.
  listing: [ls, pwd, tree, du, df]
  # AIRA-902 reading file contents. Not `${reading_head}`: that list is
  # AIRA-083's, curated for "what makes contents available", and it
  # deliberately excludes `stat` and `file` while including `jq`, `tar` and
  # `python3`, none of which belong in an allow family.
  read: [cat, head, tail, less, more, wc, nl, stat, file]
  # AIRA-903 searching. A search is a read: `grep '' file` is `cat`.
  search: [grep, egrep, fgrep, rg]
  # AIRA-904 locating. The head tells you nothing here — `find … -exec rm`
  # has heads `['find']` — so `unsafe_argv_flags.find_actions` is the rule.
  find: [find, fd]
  # AIRA-905 text shaping. `sed` is **deliberately absent**, against §3b's
  # seed table. The table asks for "`sed -n Np` only", a positive grammar over
  # the script, which one regex cannot express across compound commands —
  # while a negative list over sed's command letters is not closable.
  # GTFOBins' shell entry for sed is two characters, `sed e`: the bare `e`
  # command reads commands from stdin and runs them. It has nine siblings
  # (`1e`, `w`, `W`, `r`, `R`, `s///w`, `s///e`, `1{e …}`, `1,$w`) that cannot
  # be separated from `sed 's/foo/bar/'` without argv structure the shape does
  # not carry. `awk` stays: its dangerous constructs are words, not letters.
  text: [awk, sort, uniq, cut, tr]
  # AIRA-906 identity / environment. `env` and `printenv` are absent: `env` is
  # a wrapper head, stripped before a rule sees it, and a bare `env` dumps the
  # environment, which is AIRA-088's.
  env: [which, whoami, id, date, uname, hostname, echo, printf, "true", "false"]
  # AIRA-907 version control, read-only. The subcommand is the whole question
  # and it lives in argv, not in the head.
  git: [git]
  # AIRA-908 package managers, read-only. Every one is a GTFOBins shell entry.
  package: [pip, pip3, npm, uv]

# Flags that make a command read filenames, patterns or a program from a
# *file*, or run a binary, rather than doing what its head says. Every path
# defence in the design reads argv — `_shape.path_roles`, the `paths:`
# condition, the plugin's skeleton matching — so `wc --files0-from ./list.txt`
# looks like a bounded read of one workspace file while it reports the
# contents of every path that file names.
#
# Global rather than per-family, because heads compose: any rule that can
# admit a command containing `find` has to refuse `-delete`, whether or not
# `find` is the family it is named for.
unsafe_argv_flags:
  # matched as `--name`, on a word boundary
  long:
    - files0-from      # wc, sort, find — a NUL-separated list of paths
    - files-from       # file
    - magic-file       # file — loads a magic database as a program
    - file             # grep/sed/awk patterns-or-program from a file
    - pre              # rg — runs a preprocessor binary per file
    - pre-glob         # rg — scopes --pre, meaningless without it, refused with it
    - hostname-bin     # rg — runs a binary to resolve the hostname
    - search-zip       # rg — decompresses through external tools
    - exec             # fd
    - exec-batch       # fd
    - ext-diff         # git — runs the configured external diff driver
    - exec-path        # git — relocates the helper directory (GTFOBins shell)
    - upload-pack      # git — names a binary to run on the far side
    - receive-pack     # git
    - editor           # pip config --editor '/bin/sh -s' edit (GTFOBins shell)
    - unsafe-paths     # git apply
  # Short flags mean different things to different heads, so they are scoped
  # to the head rather than matched globally: `grep -i` (case-insensitive),
  # `grep -e` (pattern) and `grep -m 5` (max count) are among the commonest
  # things anyone types, while `file -m`, `sed -e` and `sort -m` are the
  # indirection this list exists to refuse. A global short-flag alternation
  # would have refused most of the search family to catch three of them.
  #
  # Matched with the proximity idiom AIRA-083 uses: the head, then the flag,
  # with no command separator between them. Distance is not the
  # discriminator — a separator is — so `sed -n p && grep -i x` keeps working
  # while `sed -i s/a/b/` does not.
  scoped:
    - head: file
      flags: [f, m]          # --files-from, --magic-file by their short names
    - head: sort
      flags: [m]             # merge: GTFOBins' file-read entry for sort
    - head: date
      flags: [f]             # reads each line of an arbitrary file
    - head: tail
      flags: [f]             # follow is not a bounded read
    - head: sed
      flags: [i, e, f]       # in-place; -e/-f can carry the `e` and `w` commands
    - head: awk
      flags: [f]             # program from a file, including system()
    - head: grep
      flags: [f]             # patterns from a file
    - head: rg
      flags: [z, f]          # --search-zip, patterns from a file
    - head: fd
      flags: [x, X]          # --exec, --exec-batch
    - head: wc
      flags: [f]             # guards --files0-from's short spelling if one appears
  # find's action predicates, matched as `-name` on a word boundary. Not
  # visible in `_shape.heads`, `_shape.sinks` or `paths:`, because all three
  # read the parse and these live inside one simple command's argv.
  find_actions:
    - exec
    - execdir
    - ok
    - okdir
    - delete
    - fls
    - fprint
    - fprint0
    - fprintf
