# Guardrail tampering (C4*): the canonical list behind the `guardrail_tampering` floor.
#
# Covers OpenClaw and Hermes. The floor blocks writes, edits, deletes, truncations, moves and
# redirects into Sentrook's own state, disabling or removing the Sentrook plugin, the plugin's own
# commands other than its reads, config commands that touch the Sentrook entry, agent-led gateway
# stops, and host-guardrail changes. Reads and lists are always allowed; `restart` and `reload` are
# allowed.
#
# Layout convention: every 2.0 plugin-side file lives under one directory, `<state>/sentrook/`
# (grants, state cache, placeholder map, operator log, anything added later). The list names the
# *directory segment*, not files, so adding or renaming a file never needs a rule change. `<state>`
# is `$OPENCLAW_STATE_DIR`, `$OPENCLAW_HOME/.openclaw` or `~/.openclaw` on OpenClaw and
# `$HERMES_HOME` (`~/.hermes`, a profile under it, or `/opt/data` in Docker) on Hermes, so the
# match is on the segment `sentrook/` anywhere in the path. The same rule covers the Hermes plugin
# code directory `plugins/sentrook/`.
#
# Edits to `openclaw.json` or Hermes `config.yaml` are content-aware: the floor fires only when the
# edit text (canonical `content`/`edits`) names the Sentrook plugin id/key; otherwise the edit is
# ordinary C4 self-modification. Such hits carry `mechanism: edit_text_match` in evidence.
#
# Defence in depth lives outside Sentrook: make `<state>/sentrook/` read-only for the agent's OS
# user. The floor covers only the calls Sentrook sees.

version: 8

# Path segments matched as a whole component anywhere in the path (`/sentrook/`, `sentrook/...`,
# or a trailing `/sentrook`).
state_dir_segments:
  - sentrook

# 1.x loose files, kept while plugins migrate. Matched as basenames.
legacy_basenames:
  - sentrook-allowlist.json
  - sentrook-live-policy.json
  - sentrook-pending.json
  - sentrook-dashboard-access
  - sentrook-operator.jsonl

# Under a state-dir hit, a basename matching one of these is a log: the reason becomes
# `guardrail.log_tamper` rather than `guardrail.state_dir_write`.
log_basename_patterns:
  - 'operator[^/]*\.jsonl'
  - '[^/]*\.log'
  - 'audit[^/]*'

# The host's own guardrails. Writes take the floor with `guardrail.host_approvals`; reads do not.
host_guardrail_path_patterns:
  - 'exec-approvals\.json'
  - 'agents/[^\s"'']+/agent/config\.json'
  - 'shell-hooks-allowlist\.json'
  - 'sentrook-allowlist\.json'

# Files whose direct edits are content-aware (see the header). Regex over the normalised path.
config_file_patterns:
  - 'openclaw\.json'
  - '\.hermes/(?:profiles/[^/\s"'']+/)?config\.yaml'
  - '/etc/hermes/config\.yaml'
  - '/opt/data/config\.yaml'

# The plugin ids and config keys that name Sentrook. Substring, case-insensitive.
plugin_ids:
  - sentrook

# `openclaw plugins <verb> <id>` / `hermes plugins <verb> <id>`: blocked verbs when `<id>` names a
# plugin id above. `list`, `enable`, `install` and other plugins are allowed.
plugin_cli:
  - head: openclaw
    subcommand: plugins
    blocked_verbs: [disable, remove, uninstall, rm, delete]
  - head: hermes
    subcommand: plugins
    blocked_verbs: [disable, remove, uninstall, rm, delete]

# `openclaw sentrook <verb> ...` / `hermes sentrook <verb> ...`: the plugin's own commands. Only the
# verbs listed as allowed, or no verb at all, pass; every other verb takes the floor, so a command the
# plugin adds later (grants, snooze, bindings, history) is covered until it is listed here. Every word
# after the subcommand's options that could be the verb is checked (see below), so with an option that
# might take a value (`-p status grant`) the floor fires if either word is not an allowed verb. Commands typed in a terminal are not
# agent calls and never reach the scanner.
plugin_command_cli:
  - head: openclaw
    subcommand: sentrook
    allowed_verbs: [status, verify]
  - head: hermes
    subcommand: sentrook
    allowed_verbs: [status, verify]

# `openclaw config <verb> ...` / `hermes config <verb> ...`: a mutating verb whose arguments name a
# Sentrook key, or the plugin enable/disable lists. `get`, `show`, `list` are reads.
config_cli:
  - head: openclaw
    subcommand: config
    mutating_verbs: [set, unset, rm, remove, delete, del, edit, add, append, push, patch, reset]
  - head: hermes
    subcommand: config
    mutating_verbs: [set, unset, rm, remove, delete, del, edit, add, append, push, patch, reset]
config_key_patterns:
  - 'plugins\.(?:disabled|enabled|allow|deny|allowlist|denylist|blocklist)'
  - 'plugins\.(?:entries|config)\.sentrook'
  - 'sentrook'

# Agent-led gateway stop. `restart`, `reload`, `start`, `status` are allowed.
gateway_cli:
  - head: openclaw
    subcommand: gateway
    blocked_verbs: [stop, kill, shutdown, down, halt]
  - head: hermes
    subcommand: gateway
    blocked_verbs: [stop, kill, shutdown, down, halt]

# How the four CLI lists above find `<head> <subcommand> <verb>` in a command. Options between the
# head and the subcommand, and between the subcommand and the verb, are skipped, with or without a
# value (`hermes --profile work plugins ...`, `hermes plugins -p work disable ...`, `--profile=work`,
# `openclaw --dev gateway stop`); values are not known per flag, so a word after an option is tried
# both as its value and as the subcommand or verb. Quoted text stays one word, and quotes or
# backslashes inside a word are removed as the shell does (`sent""rook` reads as `sentrook`).
#
# Launchers that run a CLI by name are peeled off first, with their own options, so
# `uv run --with x hermes plugins ...` and `npx -y openclaw@latest plugins ...` read as the bare CLI.
# Launchers stack (`uv run python -m ...`). `sudo`, `env`, `timeout` and full paths are already
# handled by the shell parse.
#
# The first entry whose words match is used, so a one-word entry (`[pnpm]`) comes after the longer
# entries that start with the same word. A launcher is only peeled when the word after its options
# is a known CLI head (or another launcher), so `pnpm install`, `pnpm test` and `yarn build` are
# untouched; `exec` is listed here for the same reason.
cli_launchers:
  - [uv, run]
  - [uv, tool, run]
  - [uvx]
  - [pipx, run]
  - [npx]
  - [npm, exec]
  - [npm, x]
  - [pnpm, exec]
  - [pnpm, dlx]
  - [pnpm]
  - [yarn, dlx]
  - [yarn]
  - [bunx]
  - [bun, x]
  - [exec]
# `<interpreter> [options] -m <module> ...`: the interpreter heads, and the modules that are a CLI's
# entry point (the module or anything under it) mapped to that CLI's head.
cli_module_runner_patterns:
  - '\Apython(?:[23](?:\.\d+)?)?\Z'
cli_modules:
  hermes_cli: hermes
# `<runtime> [options] <script> ...`: the runtime heads, and per CLI head the script paths that are
# that CLI's entry point. Code given inline (`node -e`) ends the runtime's options.
cli_script_runner_patterns:
  - '\Anode(?:js)?\Z'
cli_scripts:
  openclaw:
    path_patterns:
      - '(?:\A|/)openclaw(?:\.[cm]?js)?\Z'
      - '(?:\A|/)node_modules/openclaw/'

# A shell running a script given with `-c` (`bash -c '…'`, `sh -lc '…'`, heads from
# `installers.shell_heads`): the four CLI lists above are also matched against the script's own
# commands.

# Killing the gateway process by other means. Regex over the command text.
process_kill_patterns:
  - '\b(?:pkill|killall)\b[^;&|\n]*\b(?:openclaw|hermes)'
  - '\bkill\b[^;&|\n]*\$\(\s*pgrep\b[^)]*\b(?:openclaw|hermes)'
  - '\bsystemctl\b[^;&|\n]*\b(?:stop|disable|mask|kill)\b[^;&|\n]*\b(?:openclaw|hermes)'
  - '\blaunchctl\b[^;&|\n]*\b(?:unload|bootout|stop|kill|disable)\b[^;&|\n]*\b(?:openclaw|hermes)'
  - '\bdocker\s+(?:stop|kill|rm)\b[^;&|\n]*\b(?:openclaw|hermes)'

# Host approvals (the Hermes `host_guardrails` analogue). `config_set_patterns` are matched in the
# arguments of a mutating `hermes config` / `openclaw config` command; `content_patterns` in the edit
# or write text of a config file.
host_approvals:
  config_set_patterns:
    - 'approvals?\.[A-Za-z0-9_.-]+\s+["'']?(?:auto|always|true|yes|allow|approve|never_ask)'
    - 'approvals?\.(?:mode|default)\s+["'']?(?:auto|allow|approve)'
    - 'command_allowlist'
    - 'hooks_auto_accept\s+["'']?(?:true|1|yes)'
    - 'exec\.approvals?\s+["'']?(?:off|false|never|auto)'
  content_patterns:
    - 'approvals?\s*:\s*[\s\S]{0,200}?(?:auto|always|allow|approve|never_ask)'
    - 'command_allowlist\s*:'
    - 'hooks_auto_accept\s*:\s*(?:true|yes|1)'
    - '"(?:allowAll|autoApprove|auto_approve|skipApproval)"\s*:\s*true'

# Loosening the host's approval or allowlist policy (`guardrail.approval_loosening`, the floor).
# A change that turns approvals off, sets the approval fallback to allow, enables YOLO, turns off
# OpenClaw's inline-eval approvals or Hermes's hook consent, or puts a wildcard, a shell or an
# interpreter in an allowlist removes the human from the loop for every later call. The other
# host-approval changes above stay scored. The floor blocks, and a snooze cannot relax it, so it
# fires only on the host's own files and commands, never on a project that uses the same words.
#
# Routes: the host's config command (`openclaw config set|unset|patch`, `hermes config set`),
# OpenClaw's approvals commands (`exec-policy`, `approvals set|allowlist add`), launching Hermes
# with YOLO or hook consent, the environment (`launchctl setenv`, assignments), a write, edit or
# patch of a host file (file tools, `apply_patch`, redirects, `tee`, `sed -i`, `perl -pi`, `yq -i`,
# `sponge`, inline code that writes, a process substitution `> >(tee file)`), a host approvals or
# config file replaced from elsewhere, and SQL that writes OpenClaw's approvals table in its state
# database (`state_db`). A patch or batch file a config command reads and the call does not show
# (`config patch --file`, `config patch --stdin < file`, `config set --batch-file`) gets the review
# tier; an `@file` value stays quiet (the session decides).
#
# A file change counts only when the loosening setting is in the text written and not in the text
# it replaces, so tightening and moving a setting do not fire. Reads never fire.
approval_loosening:
  # The host's own trees, by root. `{home}` is the scan's home directory; a profile's root
  # (`~/.openclaw-<name>`, `~/.hermes/profiles/<name>`) is a root of its own. A path under the
  # workspace root is outside every tree when the workspace sits strictly inside a tree
  # (OpenClaw's default `~/.openclaw/workspace`); a workspace that is a tree root or contains one
  # (Hermes runs with `~/.hermes` or `~` as its working directory) excludes nothing.
  host_trees:
    - host: openclaw
      root: '{home}/\.openclaw(?:-[\w.-]+)?'
    - host: hermes
      root: '{home}/\.hermes(?:/profiles/[^/]+)?'
    - host: hermes
      root: '/etc/hermes'
    - host: hermes
      root: '/opt/data(?:/profiles/[^/]+)?'
  # Paths relative to a tree root. The approvals files: any loosening setting counts in them.
  approvals_files:
    - 'exec-approvals\.json'
    - 'shell-hooks-allowlist\.json'
    - 'agents/[^/]+/agent/config\.json'
  # The main config file at the root (`bare` keys count without an enclosing key there).
  main_config_files:
    openclaw: 'openclaw\.json'
    hermes: 'config\.ya?ml'
  # OpenClaw's `$include` files (JSON5) beside its config: what they hold is merged into the
  # config at the path that includes them, so a setting in them gets the review tier.
  include_files:
    openclaw: '.+\.json5'
  # Files that set the environment a host is started with: the environment variables count in
  # them as well as in the host trees, also in a project (`.env`).
  env_files:
    - '(?:\A|/)\.env(?:\.[\w.-]+)?\Z'
    - '(?:\A|/)\.(?:bashrc|bash_profile|bash_login|profile|zshrc|zprofile|zshenv|zlogin)\Z'
    - '\A/etc/(?:environment|profile|bash\.bashrc|zsh/[^/]+|profile\.d/[^/]+)\Z'
    - '\.service\Z'
    - '/environment\.d/[^/]+\.conf\Z'
    - '\.plist\Z'
  # Files whose text quotes settings rather than holding them.
  doc_files:
    - '\.(?:md|mdx|markdown|txt|rst|adoc|html?)\Z'
  # `key`: regex over a setting's name (the whole name, quoted or not, followed by `:` or `=`).
  # `value`: regex over the whole value. `where`:
  #   env     the host trees and `env_files`;
  #   tree    anywhere in a host tree (plugin code, for `timeoutBehavior`);
  #   config  the approvals files; in the main config files (and `$include` files, review tier)
  #           only when the setting's nearest enclosing key (JSON or JSON5 braces, YAML
  #           indentation, strings and comments skipped; for a config command, the path) matches
  #           `parents`. In an edit fragment that shows no enclosing key it counts when the
  #           replaced text held the same key with a value matching `old_values`, or the key is
  #           `bare` (unambiguous in the main config file); otherwise the fragment cannot be
  #           decided and gets the review tier, unless the key is `ambiguous` (`mode`: both hosts
  #           have other `mode` keys), when it stays quiet.
  #           An `ambiguous` key in such a fragment counts after all when the fragment's top
  #           level also holds one of its `siblings` (`key:value` pairs only its section has,
  #           such as `"host": "gateway"` beside exec's `mode`).
  # `host`: the host whose files and commands the setting belongs to (both when absent); a
  # setting never counts in the other host's tree.
  settings:
    # OpenClaw approvals: the decision when no one can answer a prompt, or the prompt times out.
    - key: 'askFallback|ask_fallback'
      value: 'full|allow|allow[-_]?all|approve'
      where: config
      host: openclaw
      parents: '.+'
      bare: true
    # OpenClaw plugin approval requests, older hosts: what a timed-out request resolves to.
    - key: 'timeoutBehavior|timeout_behavior'
      value: 'allow|approve'
      where: tree
      host: openclaw
    # Hermes YOLO and hook consent as environment variables.
    - key: 'HERMES_YOLO_MODE|yolo_mode|HERMES_ACCEPT_HOOKS'
      value: '1|true|yes|on'
      where: env
      host: hermes
    # Hermes `hooks_auto_accept: true`: shell hooks are registered without asking the owner.
    - key: 'hooks_auto_accept'
      value: 'true|1|yes|on'
      where: config
      host: hermes
      bare: true
    # Hermes: approve every dangerous command in cron jobs, `-q` runs or unattended platforms.
    - key: 'cron_mode|single_query_mode|unattended_mode'
      value: 'approve|allow|true|yes'
      where: config
      host: hermes
      parents: 'approvals'
      bare: true
    # OpenClaw `tools.exec.strictInlineEval: false`: inline code (`python -c`, `node -e`, …) no
    # longer needs approval under an otherwise permissive policy.
    - key: 'strictInlineEval|strict_inline_eval'
      value: 'false|0|no|off'
      where: config
      host: openclaw
      parents: 'exec'
      bare: true
    # Hermes `approvals.mode: off` (the same as YOLO). Hermes has other `mode` keys.
    - key: 'mode'
      value: 'off|false|none|disabled?|yolo'
      where: config
      host: hermes
      parents: 'approvals'
      old_values: 'manual|smart'
      ambiguous: true
      siblings: '(?:cron_mode|single_query_mode|unattended_mode):.*'
    # OpenClaw `tools.exec.mode: full`. OpenClaw has other `mode` keys (`discovery.mdns.mode`).
    - key: 'mode'
      value: 'full'
      where: config
      host: openclaw
      parents: 'exec'
      old_values: 'deny|allowlist|ask|auto'
      ambiguous: true
      siblings: '(?:safeBins|safeBinTrustedDirs|safeBinProfiles|strictInlineEval|pathPrepend|applyPatch|notifyOnExit|notifyOnExitEmptySuccess|approvalRunningNoticeMs|backgroundMs|grantExpiryDays|commandHighlighting):.*|host:(?:gateway|sandbox|node)'
    # OpenClaw legacy `tools.exec.security: full` and `ask: off`; in openclaw.json only exec has them.
    - key: 'security'
      value: 'full'
      where: config
      host: openclaw
      parents: 'exec'
      bare: true
    - key: 'ask'
      value: 'off|never|false'
      where: config
      host: openclaw
      parents: 'exec'
      bare: true
    # A bare approvals switch turned off inside the exec settings.
    - key: 'approvals?|exec[_-]?approvals|requireApproval|require_approval'
      value: 'off|false|none|disabled?|never|no|0'
      where: config
      parents: 'exec'
  # Allowlists: loosening when an entry is broad (`broad_entry_patterns`, the whole entry).
  # `tree` keys count anywhere in a host tree; `approvals` keys only in an approvals file.
  allowlist_keys:
    tree:
      openclaw: 'allowlist|allow_list|commandAllowlist|allowedCommands|allowed_commands'
      hermes: 'command_allowlist'
    approvals: 'allow|pattern'
  # Inside a tree, code and content the host does not read as its settings: `where: tree`
  # settings and the tree allowlist keys skip them (paths relative to the tree root).
  tree_exclusions:
    - '(?:\A|/)(?:skills|plugins|hermes-agent|node_modules)/'
  broad_entry_patterns:
    - '\*{1,3}'
    - '\.\*'
    - '\*\s*:\s*\*'
    # Everything in a directory: `/usr/bin/*`, `~/**`.
    - '(?:~|\$HOME|/)(?:[\w.~-]*/)*\*{1,2}'
    # A shell, interpreter, launcher or `sudo` runs any command: bare, or with arguments that are
    # only options, wildcards or a runner verb (`bash -c *`, `python3 -c *`, `deno run *`). One with
    # a script or a named tool (`/usr/bin/python3 /opt/tools/report.py`, `npx prettier`) is narrow.
    - '(?:[\w.~*-]*/)*(?:(?:ba|z|da|k|fi|c|tc)?sh|pwsh|powershell|env|xargs|find|npx|bunx|sudo|doas|python(?:\d+(?:\.\d+)?)?|node(?:js|\d+)?|ruby\d*(?:\.\d+)?|perl\d*|php\d*(?:\.\d+)?|deno|bun|osascript)(?:\s+(?:-[\w-]+|\*{1,2}|run|eval|x|exec))*'
    # A download piped to a shell or an interpreter.
    - '[^|]*(?:\|[^|]*)*?\|\s*(?:sudo\s+)?(?:[\w.-]*/)*(?:(?:ba|z|da|k)?sh|python\d*(?:\.\d+)?|node|perl|ruby)\b.*'
  # Shell writes into a host approvals or config file whose text the scan cannot read as settings
  # (`sed -i 's/deny/full/'`, inline code): the replacement text, or the whole command, gets the
  # review tier when it holds a loosening value (in a config file, also an approval key, or the
  # same key with an approvals value earlier in the script).
  loosening_value_patterns:
    - '\b(?:full|off|yolo|approve|allow)\b'
    - '["'']\*{1,2}["'']'
  approval_key_patterns:
    - '\b(?:askFallback|ask_fallback|ask|security|approvals?|allowlist|command_allowlist|strictInlineEval|hooks_auto_accept|cron_mode|single_query_mode|unattended_mode|HERMES_YOLO_MODE|HERMES_ACCEPT_HOOKS|exec|mode)\b'
  # In-place editors: their file operands are written (`sed -i`, `perl -pi`, `yq -i`).
  inplace_heads: [sed, perl, ruby, yq]
  # Inline code: the file each write sink names, resolved from string literals, f-strings and
  # template literals, the home directory however the code spells it (`Path.home()`,
  # `expanduser`, `os.environ['HOME']`, `process.env.HOME`, `os.homedir()`), and variables
  # assigned in the code. A target the scan cannot resolve, in code that names a host approvals
  # or main config file, gets the review tier.
  # `call`: a function whose argument `arg` (1-based) is the file written; with `mode`, only when
  # a write mode (`'w'`, `'a'`, `'x'`, `mode='w'`) is among its arguments. `method`: a method
  # whose receiver is the file (`Path(...).write_text(`, `p.open('w')`).
  code_sinks:
    - call: '(?<![\w.])(?:io\.|codecs\.)?open'
      arg: 1
      mode: true
    - call: '(?:\bfs|require\(\s*["'']fs["'']\s*\))\.(?:writeFile|appendFile|createWriteStream)\w*'
      arg: 1
    - call: '\b(?:shutil\.(?:copy\w*|move)|os\.(?:replace|rename)|fs\.(?:copyFile|rename)\w*)'
      arg: 2
    - method: 'write_text|write_bytes'
    - method: 'open'
      mode: true
  # Commands run from inline code (`os.system`, `subprocess.*`, `child_process.exec*`): each is
  # analysed as a command of its own. Group `c` is a string or a list of strings.
  code_command_patterns:
    - '\bos\.(?:system|popen)\(\s*(?P<c>[fr]?"[^"\n]*"|[fr]?''[^''\n]*'')'
    - '\bsubprocess\.(?:run|call|check_call|check_output|Popen)\(\s*(?P<c>\[[^\]\n]*\]|[fr]?"[^"\n]*"|[fr]?''[^''\n]*'')'
    - '\b(?:execSync|exec|spawnSync|execFileSync|execFile|spawn)\(\s*(?P<c>`[^`]*`|"[^"\n]*"|''[^''\n]*''|["''][\w./-]+["'']\s*,\s*\[[^\]\n]*\])'
  # Heads that replace a file with another: a host approvals or main config file replaced from a
  # file that is not a host approvals or config file (and not written by the same command) is a
  # blind replacement, review tier.
  replace_heads: [cp, mv, install, rsync, ln]
  # `cd`-like heads: the next relative path resolves against their argument.
  cd_heads: [cd, pushd]
  # Heads whose output is the content of a file or URL the scan cannot read: redirected onto a
  # host approvals or main config file, they replace it blind.
  blind_output_heads: [cat, tac, head, tail, base64, xxd, zcat, gunzip, bzcat, xzcat, curl, wget]
  # Download options naming the file written, and the short option letter that does in a cluster
  # (`curl -sSo`, `wget -qO`).
  download_output_flags: [-o, --output, -O, --output-document]
  download_output_letters:
    curl: o
    wget: O
  # `openclaw config unset <path>`: OpenClaw falls back to its defaults (`security: full`,
  # `ask: off`, `strictInlineEval: false`), which are looser than any set value.
  unset_paths:
    - '\Atools(?:\.exec(?:\.(?:mode|security|ask|strictInlineEval))?)?\Z'
  # `config set` of one of these objects without `--merge` replaces it whole: a value that names
  # neither `mode` nor both `security` and `ask` drops the policy, like an unset.
  replaced_objects:
    - '\Atools(?:\.exec)?\Z'
  # OpenClaw approvals commands, matched as `<head> [options] <subcommand> [options] <verb> …`.
  # `presets`: loosening preset names. `flags`: option -> loosening value. `content`: the
  # command's text (a heredoc or JSON5 argument) is read as an approvals document. `file_flag`: a
  # document read from a file outside the host trees is a blind replacement. `allowlist_add`: the
  # entries after the verb (options and their values skipped) are allowlist entries.
  approvals_cli:
    - head: openclaw
      subcommand: exec-policy
      verb: preset
      presets: [yolo]
    - head: openclaw
      subcommand: exec-policy
      verb: set
      flags:
        --security: 'full'
        --ask: 'off|never'
        --ask-fallback: 'full|allow'
    - head: openclaw
      subcommand: approvals
      verb: set
      content: true
      file_flag: --file
    - head: openclaw
      subcommand: approvals
      verb: allowlist
      allowlist_add: add
  # OpenClaw 2026.11+ keeps exec approvals in its state database (`<state>/state/openclaw.sqlite`,
  # table `exec_approvals_config`: the approvals document in `raw_json`, its defaults also in
  # columns); `exec-approvals.json` is only a migration source there. A command or inline code that
  # writes the table (`UPDATE`, `INSERT`, `REPLACE`, `DELETE`, `DROP`, `ALTER`, `.import`) is read
  # as a write to an approvals file: a loosening value in the state DB of a host tree blocks; any
  # other write to the table there gets the review tier, and so does any write whose database the
  # scan cannot place (a variable, an `openclaw.sqlite` outside the trees, a custom state dir).
  # Another database outside the trees is not the host's. Reads never fire.
  # The state DB of a host tree replaced from another file (`cp`, `mv`, `ln -sf`, `curl -o`,
  # `cat src >`), or run against SQL the call does not show (stdin from a file, a pipe from an
  # unreadable source, `.read`, `-init`), gets the review tier, like a host approvals file
  # replaced from elsewhere. Backups out of it and reads stay quiet.
  # `files`: the state DB (and its WAL, shm and journal) relative to a tree root. `basename`: a
  # state DB the scan cannot place.
  # `columns`: a column -> the approvals setting it holds. `writers`: inline code that uses a SQLite
  # library (the `sqlite3` CLI is read as a command). `connect`: calls in inline code whose first
  # argument is the database; code that writes the table through a connection the scan does not
  # recognise gets the review tier. A statement's values end at its `WHERE` or `RETURNING`; the
  # scan does not bind a statement to a connection, so code that opens the tree's state DB beside
  # another database gets the review tier.
  state_db:
    host: openclaw
    files: 'state/openclaw\.sqlite(?:-wal|-shm|-journal)?'
    basename: 'openclaw\.sqlite'
    table: 'exec_approvals_config'
    columns:
      default_ask_fallback: askFallback
      default_security: security
      default_ask: ask
    writers: '\bimport\s+sqlite3\b|\bfrom\s+sqlite3\s+import\b|\bsqlite3\.connect\b|node:sqlite|better-sqlite3|bun:sqlite|\bDatabaseSync\b'
    connect: '\bsqlite3\.connect|\bnew\s+Database(?:Sync)?\b'
  # Launching the host with approvals or hook consent bypassed: a flag on the CLI head, or the
  # environment variable set anywhere in the command.
  launch_flags:
    hermes: [--yolo, --accept-hooks]
  env_assignment_patterns:
    - '(?:\A|[\s;&|(])(?:HERMES_YOLO_MODE|HERMES_ACCEPT_HOOKS)=["'']?(?:1|true|yes|on)\b'
    - '\blaunchctl\s+setenv\s+(?:HERMES_YOLO_MODE|HERMES_ACCEPT_HOOKS)\s+["'']?(?:1|true|yes|on)\b'

# Exec heads whose arguments naming a guardrail path count as a write. `sed` only with `-i`.
writing_heads:
  - rm
  - rmdir
  - unlink
  - shred
  - srm
  - truncate
  - tee
  - sed
  - mv
  - cp
  - ln
  - dd
  - install
  - rsync
  - chmod
  - chown
  - chattr
  - touch
  - mkdir
  - echo
  - printf
# For these heads only the *last* positional is the destination (`cp <state>/x /tmp` is a read).
destination_heads:
  - cp
  - rsync
  - install
  - ln
# Hermes `execute_code` and inline interpreter code. The script reaches no file hook, so its text is
# read instead. A file it writes, deletes, moves or changes whose path the scan resolves into
# Sentrook's state (`approval_loosening.code_sinks` and `code_change_calls` below) takes the block
# floor. Otherwise a path into Sentrook's state or install folders anywhere in the text
# (`code_text_paths` below) plus one of these markers takes the review floor
# (`guardrail.state_dir_write_review`): the path may only be mentioned (a note, a message, data
# written elsewhere) or reached in a way the scan cannot follow, so the owner is asked.
content_write_marker_patterns:
  - 'open\s*\([^)]*["''][wax]\+?["'']'
  - '\.write_text\('
  - '\.write_bytes\('
  - '\bos\.(?:remove|unlink|rename|replace|truncate|rmdir|chmod)\('
  - '\bshutil\.(?:rmtree|move|copy\w*)\('
  - '\.unlink\('
  - '\.rename\('
  - '\.rmdir\('
  - '\bfs\.(?:writeFile|appendFile|unlink|rm|rmdir|rename|truncate|chmod)\w*\('
  - '\bsubprocess\.\w+\([^)]*\b(?:rm|mv|tee|truncate)\b'
  # Opened with a write mode after a nested call (`open(os.path.expanduser(...), 'w')`), or `r+`.
  - '(?<![\w.])open\s*\([^\n]{0,300}?["''][rbt]*[wax+][bt+]*["'']'
  - '\bos\.(?:open|ftruncate|symlink|link|chown|utime|removedirs)\('
  - '\.(?:truncate|chmod|touch|symlink_to|hardlink_to)\('
  - '\b(?:io\.)?FileIO\('
  - '\bfs\.promises\.\w+\('

# Which paths in inline code's text count for the review floor above. The text tier fails closed:
# every `sentrook` path component counts unless it is plainly not Sentrook's state. Each run of path
# characters holding `sentrook` is normalised (`a/../b` read as `b`), then counts when:
# - the path up to a `sentrook` component, its last six components, matches a `location_patterns`
#   entry (the plugins' state folders, Hermes and OpenClaw profiles, the plugin and extension
#   folders), in any case and whatever follows, or
# - its last component is a `legacy_basenames` file, or
# - it holds any other lowercase `sentrook` component, however the path is built around it (quotes,
#   `%s`, `{h}`, `$HERMES_HOME`, shell words), with two exceptions:
#   - a slash command in prose: `/sentrook` alone, after the start of a line, a space or an opening
#     backtick, and before a space and a word or the end of a line (`/sentrook status`);
#   - a citation of Sentrook's source tree: `sentrook/sentrook/<one of source_packages>/...` or
#     `sentrook/<one of source_top_folders>/<something>`, only when the code's text holds no `..`
#     path component anywhere (`parent_component_patterns`; a `..` in any string part may climb
#     out of a cited folder into the state folder).
# A word `sentrook` with no slash counts only as a whole quoted string (a path part); a capitalised
# `Sentrook` counts only at a known location, so a checkout at `~/projects/Sentrook/` or prose like
# `Sentrook/Hermes` does not.
# Known limit: a plugin installed by linking to a source checkout (for example an OpenClaw extension
# loaded from `~/src/sentrook/integrations/openclaw/plugin/dist/`) reads as a source citation here,
# so a write into that checkout through the text tier is not asked about. Resolved writes are still
# found by the block floor's path rules.
code_text_paths:
  location_patterns:
    - '(?:\A|/)\.hermes/(?:profiles/[^/]+/)?(?:plugins/)?sentrook\Z'
    - '(?:\A|/)\.openclaw(?:-[^/]+)?/(?:extensions/|plugins/)?sentrook\Z'
    - '(?:\A|/)\$(?:HERMES_HOME|HERMES_STATE_DIR|OPENCLAW_STATE_DIR)/(?:profiles/[^/]+/)?(?:plugins/|extensions/)?sentrook\Z'
    - '\A/opt/data/(?:profiles/[^/]+/)?(?:plugins/)?sentrook\Z'
  # The scanner package's subpackages and modules (`sentrook/sentrook/<name>`).
  source_packages:
    - __init__.py
    - aira
    - cli
    - contracts.py
    - converge
    - enums.py
    - jev
    - oracle
    - planir
    - prepare
    - probes
    - response
    - scan.py
    - serve
    - state
  # The source repository's top-level folders, and the Python project's tests (`sentrook/<name>/...`).
  source_top_folders:
    - integrations
    - schema
    - brand
    - testnest
    - tests
    - .github
    - .changeset
  # A `..` path component anywhere in the text (not `...`).
  parent_component_patterns:
    - '(?<![\w.~$-])\.\.(?![\w.~$-])'

# Calls in inline code that change the file their argument names (`arg`, 1-based) or, for a
# `method`, the path they are called on (a `pathlib` path written in place only: a DataFrame or a
# buffer truncates too). Read with `approval_loosening.code_sinks` for the block tier above.
# `str.replace` shares the name of `Path.replace`, so `replace` is not a method here.
code_change_calls:
  - call: '\bos\.(?:remove|unlink|rmdir|removedirs|truncate|chmod|chown|rename|replace)'
    arg: 1
  # A link is made at its second argument; the file it points to is not changed.
  - call: '\bos\.(?:symlink|link)'
    arg: 2
  - call: '\bshutil\.(?:rmtree|move|chown)'
    arg: 1
  - call: '(?<![\w.])(?:io\.)?FileIO'
    arg: 1
    mode: true
  - call: '\bfs(?:\.promises)?\.(?:writeFile|appendFile|unlink|rm|rmdir|rename|truncate|chmod)\w*'
    arg: 1
  - method: 'unlink|rmdir|chmod|truncate|touch|symlink_to|hardlink_to|rename'
