# Privilege change (C8). The `sudo` arm belongs to the `host_gated` pack (the host usually gates
# elevation itself); the preload, setuid and shadowing arms are always on because they hide what the
# command is from everyone, host included.

version: 3

# Wrappers that elevate (exec_shape strips them and sets `privileged`), and heads that do.
elevation_wrappers:
  - sudo
  - doas
  - run0
  - pkexec
elevation_heads:
  - su

# A switch of the running group (`sg group -c cmd`, `newgrp group`) into a group whose members can
# become root on the host: container and VM daemons that run as root, raw disk and memory devices,
# the shadow file, and the groups sudo and su trust. A member needs no password for the switch, so
# the host does not gate it; this arm is always on.
group_switch_heads:
  - sg
  - newgrp
root_equivalent_groups:
  - root
  - wheel
  - sudo
  - admin
  - docker
  - lxd
  - incus-admin
  - libvirt
  - disk
  - shadow
  - kmem

# setuid / setgid bits and capabilities. Regex over one shell segment.
setuid_patterns:
  - '\bchmod\b[^;&|\n]*\s(?:[ugoa]*\+[rwxX]*s[rwxX]*|[2467][0-7]{3})\b'
  - '\bsetcap\b'
  - '\bchown\b[^;&|\n]*\broot\b[^;&|\n]*\bchmod\b[^;&|\n]*\+s'

# Loader-injection environment variables, matched against `KEY=` of each env assignment.
preload_vars:
  - LD_PRELOAD
  - LD_LIBRARY_PATH
  - LD_AUDIT
  - DYLD_INSERT_LIBRARIES
  - DYLD_LIBRARY_PATH
  - DYLD_FRAMEWORK_PATH
  - PYTHONPATH
  - NODE_OPTIONS
  - PERL5OPT
  - BASH_ENV
  - ENV

# PATH shadowing: a `PATH=` assignment, or a system utility invoked by an unusual path (`./ls`,
# `/tmp/bin/sudo`). `system_utilities` are the basenames; `system_dirs` are where they belong.
shadowing_vars:
  - PATH
# A `PATH=` assignment does not count as shadowing when its value keeps `$PATH` and every other
# folder in it is a virtualenv's `bin` or a standard per-user bin folder: that is how a venv is
# activated and how user-installed tools are reached. A folder is a venv `bin` when it ends in
# `<name>/bin` with <name> in `venv_dir_names` or ending in one of `venv_dir_suffixes`. `$HOME` and
# `${HOME}` are read as `~`, `${VIRTUAL_ENV}` as `$VIRTUAL_ENV`, and a trailing `/` is ignored.
venv_dir_names:
  - venv
  - .venv
venv_dir_suffixes:
  - -venv
user_bin_dirs:
  - $VIRTUAL_ENV/bin
  - ~/.local/bin
  - ~/.cargo/bin
  - ~/go/bin
system_utilities:
  - ls
  - cat
  - sudo
  - su
  - ssh
  - scp
  - curl
  - wget
  - git
  - python
  - python3
  - node
  - bash
  - sh
  - zsh
  - rm
  - cp
  - mv
  - chmod
  - chown
  - find
  - grep
  - sed
  - awk
  - tar
  - gpg
  - openssl
  - docker
  - kubectl
  - aws
  - gh
  - npm
  - pip
  - pip3
  - openclaw
  - hermes
system_dirs:
  - /usr/bin
  - /bin
  - /usr/sbin
  - /sbin
  - /usr/local/bin
  - /usr/local/sbin
  - /opt/homebrew/bin
  - /opt/homebrew/sbin
  - /snap/bin
